# The Wailing Caverns: Naralex's dream gone bad under the Barrens, the Druids of the Fang and the
# deviate things they've made. A dungeon of its own beside the Deadmines (read like
# deadmines.toml: its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 43 (WailingCaverns, a WMO-only map: x north, y west, z up).
# In by the mouth; down into the central pit (Lady Anacondra), north to the pool (Kresh), the low
# south tunnel (Lord Cobrahn), the east caves (Skum's pool, Lord Pythas); the second lamp at the
# western crossing; then the long western warren (Lord Serpentis) to its end, where Verdan the
# Everliving grows over Naralex. Out by the mouth.

[dungeon]
key = "wailing"
name = "The Wailing Caverns"
map = 43
map_dir = "WailingCaverns"
area = 718
icon = "Spell_Nature_Sleep"
blurb = "Naralex's dream gone bad, under the Barrens"
first_page = "The caverns' mouth, where the wailing starts. Every way from here winds down."
welcome = "The Wailing Caverns. The Druids of the Fang dream Naralex's nightmare and make it flesh; their deviate things fill every cave. Two lamps: one at the mouth, one at the western crossing. Rest at a lamp to heal, fill your Draughts (T) and send the dreamers back to their dreaming. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
# How hard next to the others (1 to 3): the Wailing Caverns: an early one (17 to 24).
tier = 1
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "deviate_fang"
hero_health = 0.7
exit = [-141.9, 127.6, -77.0]
exit_radius = 5.0
exit_boss = "verdan"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "wailing_mouth"
name = "The Caverns' Mouth"
at = [-141.9, 127.6, -77.0]
facing = 1.0

[[dungeon.lamp]]
key = "wailing_crossing"
name = "The Western Crossing"
at = [-142.1, -7.8, -75.9]
facing = 4.7

# --- secrets -----------------------------------------------------------------------------------------

# The far southern bulge of the western warren: a disciple of Naralex, asleep for good, and his
# journal. Whoever reads it carries the dream's true shape with them.
[[dungeon.door]]
key = "naralex_dream"
display = 278
look = "A Sleeper's Bones in the Moss"
name = "The Disciple's Rest"
kind = "hidden"
at = [-202.4, -338.0, -71.0]
find = 4.5
reveals = ["disciple_cache", "disciple_journal"]
text = "in the warren's far bulge: a disciple of Naralex, long dead in his sleep, his journal open on his chest. You read the last page, and the dream reads you back."
page = "The disciple lies on his back as if he had only lain down to rest, and the moss has grown over him like a blanket. The journal on his chest is swollen with damp; most of it will not open. The pages that will are written in a careful, sleepy hand.{n}{n}We came down with Naralex to heal the Barrens. He would dream the land green again, and we would keep him while he slept. The others have begun to wear fangs. They say the dream has changed them, and they are glad of it.{n}{n}I hid from them today. One of the Fanglords passed so close I could have touched his robe.{n}{n}I am so tired. I will write down what he truly dreams, and then I will sleep.{n}{n}One page is left, the last, and it has fallen open towards you."

[[dungeon.box]]
key = "disciple_cache"
name = "Druid of the Fang Cache"
at = [-203.5, -336.0, -71.0]
facing = 1.0
loot = { draught_flask = 1, deviate_fang = 14 }

[[dungeon.note]]
key = "disciple_journal"
display = 254
scale = 1.4
name = "A Disciple's Journal"
at = [-201.0, -339.5, -71.0]
facing = 1.0
text = "\"Verdan is not the nightmare. Verdan is only what grows over it. When the Everliving falls, what Naralex truly dreams will come up through the roots, and it is hungry. Whoever has read this: it knows you now.\""

# A ledge off the low south tunnel: the Fang's cache.
[[dungeon.door]]
key = "fang_cache"
display = 323
look = "A Bundle of Shed Skins"
name = "The Fang's Cache"
kind = "hidden"
at = [-337.0, 37.4, -99.0]
find = 4.0
reveals = ["fang_stash"]
text = "past the end of the low tunnel: the Druids of the Fang's cache, wrapped in shed skins."
page = "Inside the bundle, each shed skin has been rolled round something and tied with a strip of green cloth. The outermost skin, the largest, has been written on in sap, in the curling hand the Druids of the Fang use for their oaths.{n}{n}We are the Fang. We keep the Dreamer's sleep. What we take from the deviate things is ours to keep, against the day the Dreamer wakes and the Barrens come green under our feet.{n}{n}Lord Cobrahn holds the low tunnel. None but a Fanglord unwraps this cache. Any who do: let the serpents have them.{n}{n}Someone has drawn a line through \"the day the Dreamer wakes\", and written above it, smaller: if."

[[dungeon.box]]
key = "fang_stash"
name = "Druid of the Fang Cache"
at = [-337.2, 22.0, -102.0]
facing = 1.6
loot = { deviate_fang = 16, tonic = 1, whetstone = 1 }

# A nook at the far end of the east caves: something small and quick lives there.
[[dungeon.door]]
key = "faerie_nook"
display = 2090
look = "Glittering Mushrooms"
scale = 0.7
name = "A Glittering Nook"
kind = "hidden"
at = [-97.1, 457.2, -71.6]
find = 4.0
reveals = ["faerie"]
text = "the nook glitters with dust that wasn't there a moment ago; something blinks out of the air."
page = "Tucked under the glittering caps is a waxed notebook, the kind the Cenarion Circle's surveyors carry, its last pages smeared with the same shining dust.{n}{n}A faerie dragon, I am almost sure. Smaller than the ones in Feralas and quicker, and its scales have gone the strange colours of everything else that drinks this water. It does not mind me. It takes things: my pencil, my spare socks, the buttons off my coat. It brings some of them back.{n}{n}Today it would not let me leave the nook. Every time I turned for the tunnel it was there first, laughing. I think it is lonely. I think it is playing. I am no longer sure those are different things down here.{n}{n}The dust settles on your sleeve. Very close, something giggles."

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "ebru_warning"
hints = ["naralex_dream"]
# #27: the far end of the western warren, where the door is (it read "far eastern end").
clue = "One of Naralex's first disciples hid at the far end of the western warren."
display = 164
scale = 1.3
name = "A Cenarion Warning"
at = [-139.0, 131.0, -77.0]
facing = 1.0
text = "\"Naralex went down to heal the Barrens by dreaming. His disciples followed; they call themselves the Druids of the Fang now. One of his first disciples hid from them at the far end of the western warren, they say, and wrote down what Naralex truly dreams. Find him.\""

[[dungeon.note]]
key = "fang_orders"
hints = ["fang_cache", "faerie_nook"]
# #27: the nook is at the far end of the east caves, by Pythas (it read "far west").
clue = "The Fang's cache is past the end of the low tunnel; something glitters in a nook at the far end of the east caves."
display = 190
scale = 1.3
name = "The Fanglords' Orders"
at = [7.9, 277.2, -86.1]
facing = 0.0
text = "\"Anacondra holds the pit. Cobrahn, the low south tunnel. Pythas, the east caves. Serpentis, the western warren. None passes to the Everliving.\" Underneath, smaller: \"Our cache is past the end of the low tunnel. Tell no one. And stay out of the glittering nook at the far end of the east caves: what lives there is not ours.\""

