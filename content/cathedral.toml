# The Scarlet Monastery's Cathedral: the Crusade's heart, where Commander Mograine guards the
# altar and High Inquisitor Whitemane will not let him stay dead. A dungeon of its own beside the
# Deadmines (read like deadmines.toml: its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 189 (MonasteryInstances: x north, y west, z up), only the
# Cathedral wing's part of it read. In by the courtyard gate; through the courtyard's Crusade; the
# nave (the second lamp); and the altar, where Mograine stands and Whitemane waits. Behind the
# altar, a door nobody opens. Out by the gate.

[dungeon]
key = "cathedral"
name = "Scarlet Monastery: Cathedral"
map = 189
map_dir = "MonasteryInstances"
area = 796
window = [[740.0, 1230.0], [1250.0, 1490.0]]
icon = "Spell_Holy_HolySmite"
blurb = "The Crusade's heart: Mograine at the altar, and Whitemane who won't let him die"
first_page = "The Cathedral's courtyard gate. The Crusade sings inside; they've heard you coming."
welcome = "The Scarlet Monastery's Cathedral. Commander Mograine guards the altar, and High Inquisitor Whitemane will not let him stay dead. Two lamps: the courtyard gate, and the nave. Rest at a lamp to heal, fill your Draughts (T) and send the Crusade back to its prayers. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "scarlet_insignia"
hero_health = 0.7
exit = [855.7, 1321.5, 18.7]
exit_radius = 5.0
exit_boss = "mograine"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "cathedral_gate"
name = "The Courtyard Gate"
at = [855.7, 1321.5, 18.7]
facing = 0.4

[[dungeon.lamp]]
key = "cathedral_nave"
name = "The Nave"
at = [1013.5, 1361.5, 27.3]
facing = 0.0

# --- doors -------------------------------------------------------------------------------------------

[[dungeon.door]]
