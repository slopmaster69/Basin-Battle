bars = [[1052.0, 1330.0], [1052.0, 1465.0]]

# --- secrets -----------------------------------------------------------------------------------------

# Behind the altar: a door nobody opens, and the Inquisitor the Crusade locked behind it.
[[dungeon.door]]
key = "fairbanks_door"
name = "The Door Behind the Altar"
kind = "hidden"
at = [1205.5, 1397.5, 29.0]
find = 4.0
reveals = ["fairbanks"]
text = "the door behind the altar was never locked from the outside. The thing behind it stands up."

# The courtyard's west chapel: the Crusade's reliquary, and a shard of something that burned.
[[dungeon.door]]
key = "scarlet_reliquary"
name = "The Crusade's Reliquary"
kind = "hidden"
at = [785.5, 1289.4, 18.7]
find = 4.0
reveals = ["reliquary_cache", "reliquary_inscription"]
text = "in the courtyard's west chapel: the Crusade's reliquary, and in it a shard of a blade that still smoulders. It knows the name Mograine."

[[dungeon.box]]
key = "reliquary_cache"
at = [787.0, 1291.0, 18.7]
facing = 0.4
loot = { draught_flask = 1, scarlet_insignia = 14 }

[[dungeon.note]]
key = "reliquary_inscription"
name = "The Reliquary's Inscription"
at = [784.0, 1287.5, 18.7]
facing = 0.4
text = "\"A shard of the Ashbringer, which the elder Mograine bore. Whoever carries its memory to the altar will see the son burn as the father did, should the High Inquisitor raise him one time too many.\""

# A chaplain's hiding place in the courtyard.
[[dungeon.door]]
key = "chaplain_cache"
name = "A Chaplain's Hiding Place"
kind = "hidden"
at = [892.7, 1434.2, 18.7]
find = 4.0
reveals = ["tithe_box"]
text = "behind a statue in the courtyard: the tithes a chaplain kept for himself."

[[dungeon.box]]
key = "tithe_box"
at = [893.5, 1436.0, 18.7]
facing = 3.0
loot = { scarlet_insignia = 16, tonic = 1, whetstone = 1 }

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "crusade_hymn"
name = "A Crusade Hymnal"
at = [870.1, 1325.2, 18.0]
facing = 0.4
text = "\"...and Whitemane shall raise him, and raise him again, for the Commander is the Crusade's sword and she its hand.\" In the margin, in a smaller hand: \"The reliquary in the west chapel holds a shard of the Ashbringer. The Inquisitor says never to bring it near him.\""

[[dungeon.note]]
key = "fairbanks_warning"
name = "A Warning on the Altar Steps"
at = [1145.4, 1361.3, 30.7]
facing = 0.0
text = "\"Do not open the door behind the altar. Fairbanks is not what he was.\""

