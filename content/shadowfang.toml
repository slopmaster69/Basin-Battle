# Shadowfang Keep: Arugal's keep in Silverpine, its halls full of his worgen and its old lords'
# ghosts. A dungeon of its own beside the Deadmines (read like deadmines.toml: its lists join the
# rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 33 (Shadowfang: x north, y west, z up), only the keep's part
# of it read. In by the gate; the courtyard (Rethilgore, and Razorclaw in the kitchen yard at its
# south end); the great hall east (Baron Silverlaine's ghost, and the second lamp); the chapel up in
# the west wing (Commander Springvale); the walk above the courtyard (Odo the Blindwatcher); the
# upper rooms (Fenrus) and the rampart (Wolf Master Nandos); and the top, where Arugal waits. Out
# by the gate.

[dungeon]
key = "shadowfang"
name = "Shadowfang Keep"
map = 33
map_dir = "Shadowfang"
area = 209
window = [[-330.0, 2040.0], [-40.0, 2350.0]]
icon = "Spell_Shadow_Charm"
blurb = "Arugal's keep in Silverpine, full of his worgen and its old lords' ghosts"
first_page = "The keep's gate, under the broken portcullis. The howling starts past the courtyard."
welcome = "Shadowfang Keep. Arugal's worgen hold the halls, and the keep's old lords haven't left either. Two lamps: one at the gate, one at the far end of the great hall. Rest at a lamp to heal, fill your Draughts (T) and send the keep's dwellers back to their posts. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "moonsilver"
hero_health = 0.7
exit = [-234.6, 2117.9, 77.3]
exit_radius = 5.0
exit_boss = "arugal"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "shadowfang_gate"
name = "The Keep's Gate"
at = [-234.6, 2117.9, 77.3]
facing = 1.57

[[dungeon.lamp]]
key = "shadowfang_hall"
name = "The Great Hall's Hearth"
at = [-66.5, 2153.5, 87.6]
facing = 3.14

# --- secrets -----------------------------------------------------------------------------------------

# Arugal's study, high in the west wing: his journal, and what he did to himself.
[[dungeon.door]]
key = "arugal_journal"
name = "Arugal's Study"
kind = "hidden"
at = [-247.4, 2319.5, 97.0]
find = 4.0
reveals = ["study_cache", "arugal_last_entry"]
text = "a study high in the west wing, its desk under a drift of torn pages: Arugal's journal. The last entries are in a hand that shakes, then claws."

[[dungeon.box]]
key = "study_cache"
at = [-246.6, 2317.5, 96.5]
facing = 0.0
loot = { draught_flask = 1, moonsilver = 14 }

[[dungeon.note]]
key = "arugal_last_entry"
name = "Arugal's Journal, the Last Page"
at = [-248.5, 2321.0, 97.0]
facing = 0.0
text = "\"My children. My beautiful children. The curse that made them is in my blood now too; I have tasted it. When they come for me, and they will, let them see what their father truly is.\""

# The kitchen yard's cellar, behind Razorclaw's block: the butcher's own larder.
[[dungeon.door]]
key = "butcher_larder"
name = "The Butcher's Larder"
kind = "hidden"
at = [-210.0, 2273.0, 73.6]
find = 3.5
reveals = ["larder_cache"]
text = "behind the butcher's block, a larder nobody wanted to open. Under the meat, someone's savings."

[[dungeon.box]]
key = "larder_cache"
at = [-209.0, 2275.0, 73.6]
facing = 1.57
loot = { moonsilver = 16, tonic = 1 }

# A corner of the courtyard where the dead stand watch.
[[dungeon.door]]
key = "deathsworn_corner"
name = "The Deathsworn's Corner"
kind = "hidden"
at = [-162.2, 2237.8, 77.1]
find = 4.0
reveals = ["deathsworn"]
text = "in the courtyard's far corner the air goes cold. A captain of the dead turns from his watch."

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "dalaran_report"
name = "A Kirin Tor Report"
at = [-222.7, 2117.8, 77.7]
facing = 1.57
text = "\"Arugal summoned the worgen to fight the Scourge. He calls them his children. He has locked himself in the top of the keep with them. His study in the west wing is where he wrote everything down, if anyone can reach it.\""

[[dungeon.note]]
key = "servants_gossip"
name = "A Servant's Note"
at = [-233.8, 2177.5, 77.7]
facing = 0.0
text = "\"The butcher keeps more than meat behind his block. And don't go in the courtyard's north-east corner after dark: the dead Deathsworn still keep their watch there.\""

