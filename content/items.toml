# Basin Battle: the Hero tab's wares. Rings, necklaces, trinkets, cloaks and tabards for the slots
# the class sets leave empty (neck, two fingers, two trinkets, back, tabard), and helms that take
# the set helm's place (its share of the set bonus for a look and an effect). Each one changes how
# you play. Worn ones can be reforged at the shop to the tier dropping now.
#
# The shop shows each hero five of these at a time, at the gear tier of the wave (so their stats
# keep up), restocked every wave. A Restock card rolls a fresh four for a little gold.
#
#   slot      neck, finger, trinket, back, head or tabard (fingers and trinkets come in pairs)
#   quality   uncommon, rare, epic or legendary: the price and how often it turns up
#   display   the item's look (ItemDisplayInfo), and `icon` the matching icon for the shop card. A
#             cloak's display must carry a cape texture (Cape_...) or nothing hangs on the back.
#   class     only offered to this class (and its spell effects may name its spells)
#   from_wave not offered before this wave
#   stats     shares of the slot's stat points: stamina, strength, agility, intellect, spirit, or
#             main (the wearer's class stat). A cloak also has a little armour.
#   text      what the tooltip and the shop card say it does
#   [[item.effect]] as a talent's: `stats` (any of kit.rs ITEM_STATS), `team` (an aura on you and
#             allies within 30 yd), a `proc` with an `amount`, or a spell patch with `spells`.
#
# The items' own effects:
#   gold_find      you pick up that much more gold
#   hub_leech      that share of all your damage heals the Ancient
#   defence_aura   defences within 20 yd of you deal that much more damage
#   rise           you get back up that much sooner after falling
#   undying        once a wave, a killing blow leaves you at 30% health
#   divine         below 35% health, immune to damage for that many seconds (once a minute)
# and the cards' passives: thorns and lightning (multiples of your hit), leech, execute, echo,
# cleave, windfury, split, radius, shield, raise_dead, soul_harvest, bloodthirst, per_wave.

