# Basin Battle: powers, the picks that change a run.
#
#   source = "escalation"  offered (with cards.toml's legendaries) when the run escalates
#   source = "boss"        offered when a boss falls, in place of an ordinary card: a boss's own
#                          (`boss` = its key in game.toml) or any boss's
#   class                  only for this class (its spell patches may name its spells)
#   icon                   the spell whose icon the card and the buff bar show
#   aura                   a spell whose lasting look the hero wears while they hold it
#   grow                   how much bigger it makes the hero (0.2: 20%)
#   rarity                 legendary (escalations) or epic (bosses), by default
#   [[power.effect]]       as an item's: `stats` (kit.rs ITEM_STATS), `team` (an aura on you and
#                          allies within 30 yd), a `proc` with an `amount`, or a spell patch with
#                          `spells` (all, school:fire, tree:arms, kind:nova, or spell keys) and
#                          add / pct / set / more on the spell's numbers.
#
# Entry order doesn't matter to the client: add, remove and reorder freely.

