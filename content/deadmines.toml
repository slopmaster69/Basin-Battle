# --- secrets ----------------------------------------------------------------------------------------

# The cook's pantry: the smaller of the two tents at the south end of the cove, before you reach
# him (in from the landing, down the beach and south).
[[dungeon.door]]
key = "cookie_pantry"
display = 2890
look = "A Heap of Sacks"
name = "Cookie's Pantry"
kind = "hidden"
at = [-159.0, -908.0, 8.8]
find = 4.0
reveals = ["pantry"]
text = "found Cookie's pantry under a heap of sacks, in the little tent at the south end of the cove. A jar in it wriggles."
page = "The tent smells of fish and old onions. Pinned to the pole with a filleting knife is a greasy card, written out in a pirate's hand, as if someone had stood over the pot and taken it down word for word.{n}{n}COOKIE'S STEW, as he gargled it to me. Salt pork, two fists. Rum, a good glug, and one for the cook. Whatever the lads caught that morning, scales and all. Boil till it fights back.{n}{n}Then the jar. Not before the pot boils, he says, and never all of it. And never let him see it once he's hurt, or he'll eat the lot, and there's no telling what comes up out of him after. The last mate who tried to take it off him is in the stew.{n}{n}Among the sacks, the jar knocks against your boot. It is knocking from the inside."

[[dungeon.box]]
key = "pantry"
at = [-158.6, -907.4, 8.8]
facing = 2.0
loot = { secret_ingredient = 1, plunder = 8 }

# VanCleef's quarters, aft of the Juggernaut's mast: a letter, and his strongbox.
[[dungeon.door]]
key = "vancleef_quarters"
display = 32
look = "A Barrel Stenciled 'E. V.'"
name = "VanCleef's Quarters"
kind = "hidden"
at = [-105.0, -818.0, 37.9]
find = 4.0
reveals = ["quarters", "vancleef_letter"]
text = "found VanCleef's quarters under a hatch aft of the mast, behind a barrel stenciled E. V. A letter he never sent lies inside."
page = "Below the hatch is a cabin no bigger than a cell, kept as neat as a mason's yard. A hammock, a sea-chest, a chart of the Westfall coast pinned flat with four chisels. On the table lies a sheet of Stonemasons' Guild paper, ruled in red, in a hand that pressed hard enough to score the wood beneath.{n}{n}OWED BY THE HOUSE OF NOBLES, for the rebuilding of the city after the orcs burned it. Walls, gates, the Cathedral, the Keep. Wages, two years. Paid: nothing.{n}{n}Beneath the sum are the names of every noble who voted against paying it, and beside each a small red mark. Most of the marks are crosses. A few are still only dots.{n}{n}Folded under the chisels is a letter in the same hand, addressed to Vanessa. It was never sealed."

[[dungeon.note]]
key = "vancleef_letter"
display = 164
scale = 1.3
name = "A Letter, Never Sent"
at = [-106.0, -815.0, 37.8]
facing = 1.5
text = "\"My dearest Vanessa -- if this reaches you, I am dead and Stormwind has won nothing. They took everything from us. I will not let them take the Brotherhood. Even dead, I will stand. Even dead, I will not bow. -- your father\""

[[dungeon.box]]
key = "quarters"
at = [-105.0, -821.0, 37.9]
facing = 1.5
loot = { draught_flask = 1, plunder = 20 }

# The east lobe's back wall: a seam of silver, and Miner Johnson, who sealed himself in with it.
[[dungeon.door]]
key = "johnson_seam"
display = 48
look = "A Glint of Silver in the Rock"
name = "Johnson's Seam"
kind = "hidden"
at = [-118.0, -450.0, 55.6]
find = 4.0
reveals = ["johnson"]
text = "found a seam of silver dug out by hand in the east lobe's back wall. The man who dug it turned around."
page = "Someone has cut a ledge into the wall with a pick and a great deal of patience, and the silver in it runs bright as a stream. Scratched beside it, the letters gouged deep enough to hold the lamp-soot:{n}{n}THIS SEAM IS JOHNSON'S. Not the foreman's. Not the Kingpin's. Not Gilnid's for his smelter. I found it before the cave-in and I dug it out after. Mine by right.{n}{n}Under that runs a tally of days, and beside each a weight in ounces. The weights climb. The hand gets worse. The last lines are only the word MINE, over and over, until the scratches turn to gouges and stop.{n}{n}A lantern burns on the ledge, freshly trimmed. At the end of it, a man in a battered miner's helm stops digging."

# The powder crates across the cannon gallery's alcove.
[[dungeon.door]]
key = "marisa_alcove"
name = "Marisa's Alcove"
look = "Stacked Powder Crates"
kind = "illusory"
display = 31
at = [-110.0, -615.0, 14.2]
facing = 0.0
scale = 1.8
bars = [[-110.0, -607.0], [-110.0, -623.0]]
reveals = ["marisa", "gallery"]
text = "found Marisa du'Paige in the alcove behind the empty powder crates."
page = "A blanket, a stub of candle, and a skin of frost on everything. Loose pages are tucked into a crack in the rock, written small to save paper.{n}{n}First night behind the crates. I heard them in the gallery, the Kingpin's men, asking after the mage who saw too much at Moonbrook. I held my breath until it froze on my lips.{n}{n}Fourth night. One of them sat down on the other side of the crates and talked to me as if he knew. He said Stormwind still has a warrant with my name on it, and the Brotherhood never asked what for. He said VanCleef pays his people, which is more than the Crown ever did.{n}{n}Ninth night. I have stopped hiding.{n}{n}The candle is still warm. Close by, frost crackles across the stone."

# The back of the goblins' workshop, past the sawhorses: the noble they keep.
[[dungeon.door]]
key = "noble_cell"
display = 181
look = "A Chain Bolted to the Floor"
scale = 1.2
name = "The Back of the Workshop"
kind = "hidden"
at = [-300.0, -611.0, 47.6]
find = 4.0
reveals = ["noble"]
text = "found a man in the rags of fine clothes at the back of the workshop, talking to the dark. He turned."
page = "A chain runs from a bolt in the floor to an open cuff. The wall above it is covered in writing, scratched with a nail by someone who was taught a fine hand and has lost it.{n}{n}I am a lord of the House of Nobles. I sat in the chamber when the masons came for their wages, and I voted no. I would vote no again. Tell my wife they want gold for me. Tell her to pay it.{n}{n}Lower down, the letters grow larger and lean the other way. They have stopped asking for gold. He comes in the dark and asks me whom I serve. I tell him the King.{n}{n}Lowest of all, in a hand that is not the first one: WE SERVE. WE SERVE. AS HE SERVES.{n}{n}Deeper in the dark, the muttering stops."

