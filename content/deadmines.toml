# --- the way through: lamps -----------------------------------------------------------------------
# Three lamps the whole way, and long walks between them: in by the sea tunnel (the landing), up it
# to the cove's east beach, round the scaffold that rings the Juggernaut to the dry dock, west
# through the Ironclad Door and up the Cannon Gallery to the Foundry; the next lamp is past
# Gilnid, at its back door, and the last in the galleries before Rhahk'Zor.

# --- area 1: the cove's east beach ------------------------------------------------------------------

# The smugglers' tunnel runs back from the landing into the cliff: a pirate stands in its mouth,
# and two more guard its strongbox where it drops away. (He was hidden until you were on him: the
# first creature below taught nothing but a hit from the dark. Now one pirate, alone and seen
# coming, is the first lesson; two at the strongbox the second. Nov 7 2026.)
