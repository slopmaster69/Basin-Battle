# fight in the FORGE"). Three acts across the mine:
# 1. The front door: a broad sweep, an overhead that sticks a moment, a shoulder rush.
# 2. At about two thirds he brings the mouth's props down (rocks over the tunnel; the front door
#    barred while he fights) and runs back through the galleries, the Mast Room and the workshop to
#    the Foundry, rocks shaken loose behind him (light ones), waiting there for the heroes.
