# The Deadmines: Elwynn Survival's souls-like dungeon, read beside survival.toml. Its lists
# ([[item]], [[mob]], [[weapon]]...) join survival.toml's (what's found below is good above too);
# [dungeon] is the world below: the Smuggler's Logbook at camp, the lamps, doors, strongboxes and
# every fight, laid out on the instance's own ground (map 36, read from the host's game data).
#
# Places are WoW coordinates on map 36 (x north, y west, z up). The run goes backwards: in by the
# smugglers' tunnel off Ironclad Cove, out through the mine's front door into Moonbrook.

[dungeon]
name = "The Deadmines"
# The logbook lies on a lectern beside the camp's chest (Elwynn).
book = [-9511.0, 110.0]
book_facing = 5.5
# The camp holds its first raid before the book can be read.
gate_raids = 0
# How hard next to the others (1 to 3): the Deadmines: an early one (17 to 26).
tier = 1
# The camp's first clear of it (every boss down in one run): into the chest. Scaled by tier
# (silver and bronze for a first dungeon, then pearl, then silk); tune freely.
first_clear = { silver = 2, bronze = 3 }
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "plunder"
# Each hero below past the first: foes take this share more health (and their blows
# `combat.hero_damage` more), as on the surface.
hero_health = 0.7
# Out the front door (the mine's mouth), once Rhahk'Zor is down.
exit = [-16.4, -383.1, 61.8]
exit_radius = 5.0
exit_boss = "rhahkzor"
weapon_chance = 0.08
armor_chance = 0.06
# A boss: one of its pieces falls for certain, each other piece this often.
boss_extra_chance = 0.25
# The bosses stand again (and the strongboxes fill) this long after the first was beaten, once
# no hero is below: the Deadmines can be run again for their loot. Lamps, gates and shortcuts
# stay as they are.
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# The smugglers come ashore on the cove's east beach, below their tunnel.
[[dungeon.lamp]]
key = "landing"
name = "The Smugglers' Landing"
at = [-80.0, -936.0, 40.0]
facing = 3.2

