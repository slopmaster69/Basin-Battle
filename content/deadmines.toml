# === secrets, rares and the Brotherhood's other hands ===============================================
# What isn't on the way through: a hidden pantry, a captain's quarters, a cave-in that isn't one,
# powder crates stacked across an alcove, a prisoner nobody talks about. Notes lying about say
# where to look. Some bosses aren't done when they fall, for those who found the right thing.

# --- notes ------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "smugglers_tally"
hints = ["cookie_pantry"]
clue = "Cookie's jar is kept in the little tent at the south end of the cove."
display = 190
scale = 1.3
name = "A Smuggler's Tally"
at = [-84.0, -939.0, 40.0]
facing = 2.0
text = "\"Two crates salt pork, one keg rum, one jar of something for the cook. He says it's his secret ingredient and he keeps it in the little tent at the south end of the cove, where the pirates won't drink it. Whatever's in that jar MOVES. Don't open it.\""

[[dungeon.note]]
key = "smite_orders"
hints = ["vancleef_quarters"]
clue = "VanCleef keeps quarters aft of the Juggernaut's mast, under the stern."
display = 183
scale = 1.3
name = "Orders, Sealed in Red"
at = [-8.0, -772.0, 9.5]
facing = 1.0
text = "\"Smite, the Juggernaut is yours to guard. My quarters at the stern are MINE. Nobody goes aft of the mast. Nobody reads what I leave there. Not you, not the goblins, not my own daughter's tutor. -- E. V.\""

[[dungeon.note]]
key = "gilnid_ledger"
hints = ["johnson_seam"]
clue = "Johnson went after a silver seam at the very back of the east lobe, past the pond."
display = 105
scale = 1.4
name = "Gilnid's Ledger"
at = [-247.0, -575.0, 51.1]
facing = 3.0
text = "\"No silver out of the east lobe since the cave-in. Johnson swears there's a seam at the very back of it, past the pond, and that the foreman wants it for himself. Johnson went back for it alone. Not seen in a week.\""

[[dungeon.note]]
key = "miners_diary"
