# Basin Battle gear: the looks and names of every class's sets, tier by tier.
#
# Stats are worked out from the tier, quality and slot, so every piece of the same name always has
# the same numbers (the client remembers items by number between sessions).
#
# Tiers: 0 Militia (greens, cycle 0), 1 Sentinel (cycle 1), 2 Vanguard (cycle 2), 3 Warlord (cycle 3),
# 4 Conqueror (cycle 4), 5+ Ascended (recoloured sets, cycle 5 onwards).
# Slots: head, shoulders, chest, waist, legs, feet, wrists, hands. A 0 display falls back to the
# tier before.

[budget]
# Stat points on a quality-1.0 chest at tier 0; x tier_mult per tier. A tier (an Escalation) must
# lift a hero by less than it lifts the enemies (x1.6 health), or the run gets easier as it goes.
base = 8.0
tier_mult = 1.3
# Quality factors: poor/common (white), uncommon (green), rare (blue), epic (purple), legendary.
quality = [1.0, 1.0, 1.1, 1.2, 1.35]
# Slot weights: head, shoulders, chest, waist, legs, feet, wrists, hands.
slot_weight = [0.8, 0.8, 1.0, 0.6, 1.0, 0.6, 0.6, 0.8]
# Required level by tier.
# (Heroes gain about a level a wave, plus bonus levels for bosses and bases.)
required_level = [1, 10, 18, 26, 34, 42, 50, 56, 60]
# Item level by tier (sets the tooltip's ordering only).
item_level = [10, 30, 50, 66, 76, 83, 88, 92, 96]
# What one point of each stat does.
stamina_health = 0.006      # +0.6% max health per Stamina
main_stat_damage = 0.008    # +0.8% damage per Strength / Agility / Intellect
spirit_regen = 0.0004       # +0.04% health per second per Spirit
# Armour by armour type for a weight-1.0 piece at tier 0, and damage reduction per armour point
# (armour / (armour + armor_k)).
armor = { plate = 120, mail = 80, cloth = 30 }
# armor_k grows by armor_k_per_level for each level of the enemies striking (the 1.12 rule,
# 400 + 85 a level), so new gear's armour keeps its worth without running away with the game.
# A starting plate set against level-2 enemies: about 40% of every blow; late, about a third.
armor_k = 400.0
armor_k_per_level = 85.0

