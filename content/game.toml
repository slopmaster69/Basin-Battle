# Basin Battle: game content and tuning.
#
# Everything here refers to the game by number (display IDs, race and class IDs, spell IDs for
# icons and visuals), never by copying its files. Change the numbers, restart the server, play.
# Cards live in cards.toml and gear in gear.toml, next to this file.
#
# Entry numbers the client caches (creatures, items) are derived from positions in these lists:
# add new enemies and cards at the END of their list so existing ones keep their numbers.

[game]
# How many different spells (cards that fire on their own) and passives (everything else) a build
# holds. Once a kind is full, offers of that kind only rank up what you have.
spell_slots = 6
passive_slots = 6
# The Hearthstone: seconds to channel, and seconds until it can be used again.
hearth_secs = 3
hearth_cooldown = 20
# Spells cast by hand (the add-on's bar, keys 1-6): a short global cooldown between casts, and
# a little more damage than letting them fire on their own (.bb auto).
gcd_secs = 1.0
hand_cast_bonus = 0.15
# A fallen hero gets up at the Ancient after respawn_secs (+respawn_per_wave a wave, at most
# respawn_cap). Only the Ancient falling ends a run.
respawn_secs = 8.0
respawn_per_wave = 1.0
respawn_cap = 20.0
# Seconds between the first player arriving and wave 1. Anyone can type .start in chat to skip.
countdown_secs = 30
# Seconds of rest between waves; after a boss wave the break is longer (time for an expedition).
intermission_secs = 20
boss_intermission_secs = 40
# Clearing this wave wins the run (the fourth boss, the Archlich, leads it); endless waves follow.
victory_wave = 20
# The world stops while anyone chooses a card, and every pick must be made before it goes on.
pause_for_picks = true
# Seconds a dead enemy lies on the ground before it disappears; lootable corpses stay longer.
corpse_secs = 6.0
loot_corpse_secs = 45.0
# Players heal this share of their health every second.
player_regen_per_sec = 0.015
# Share of its full health the hub regains after each cleared wave.
hub_repair_per_wave = 0.15
# Seconds of warning before an Escalation once the last base is claimed.
escalation_warning_secs = 20
# Gold every player gets for each enemy killed (times the enemy's gold weight, times the wave).
gold_per_kill = 5
gold_per_kill_per_wave = 0.25
# And a bounty for every cleared wave: wave_gold + wave_gold_per_wave x the wave, to everyone.
wave_gold = 10
wave_gold_per_wave = 4

[hub]
name = "Ancient of the Basin"
subname = "Right-click for upgrades"
display_id = 2429
level = 60
health = 6000
# The hub's health also grows each wave, so late waves don't one-shot it.
health_per_wave = 0.08
# How close an enemy must get to strike the hub, in yards from its centre.
reach = 6.0
bounding_radius = 2.5

[levels]
max_level = 60
# Every level adds this share of the class's level-1 health and damage.
health_per_level = 0.07
damage_per_level = 0.07
# Experience to go from level L to L+1: xp_base + xp_per_level * L.
xp_base = 100
xp_per_level = 30
# A level a wave: kills carry a hero at most levels_per_wave levels a wave (the experience bar
# fills over a wave and waits there). Objectives give bonus levels on top: boss_bonus for each
# boss killed, base_bonus the first time each base is claimed in a run.
levels_per_wave = 1
boss_bonus = 1
base_bonus = 1

[scaling]
# What elites (and the Stitched Horrors guarding bases) cast; see [[ability]] below.
elite_abilities = ["crushing_slam"]
# Armor: elites and bosses shrug off this share of every physical blow from heroes and pets
# (spells of other schools pass through) until a warrior's Sunder Armor strips it, each stack
# taking armor_per_sunder off. A party without a warrior feels it on bosses; one with a
# warrior sunders for everyone.
elite_armor = 0.1
boss_armor = 0.2
armor_per_sunder = 0.04
# Enemy health: health_base x (1 + health_per_wave x (wave-1)) x health_early per wave up to
# wave late_from, then x health_late per wave. The levels' growth is matched by health_early and
# health_late; health_per_wave keeps up with upgrades, talents and gear. Fewer, tougher enemies:
# a single-target spell takes three or four hits on a normal enemy all run long.
health_base = 1.3
health_per_wave = 0.10
# From wave `late_from` enemy health compounds faster: heroes' spells, upgrades and gear grow
# steeply as a run goes on, and the waves must outgrow them, or the run gets easier as it goes.
health_early = 1.03
health_late = 1.08
late_from = 4
# Damage per wave, and how much harder enemy swings and shots land on heroes (defences and the
# Ancient take the plain amount): a normal enemy's hit is a few percent of a hero's health.
damage_wave = 1.08
hero_damage = 1.7
hero_damage_per_wave = 0.08
# x1.7 at wave 1, and hero_damage_per_wave more each wave after: about x3.2 by wave 20 (2.5 from
# the start was a little much early). Armour stretches with the enemies' level (gear.toml), so a
# normal hit grows from about 2% of a hero's health early to 5-8% by waves 15-20. Elites,
# bosses' marked strikes and the rare Plague Butcher are the spikes. The server log's
# [balance] lines show what each hero took every wave.
# And on the Ancient's defences (treants, springs, hired defenders), so they wear down under
# a pack's attack and have to be guarded or rebuilt.
defence_damage = 1.2
# Each Escalation (cycle) multiplies enemy health and damage.
health_cycle = 1.4
damage_cycle = 1.2
# Enemies in a wave: (count_base + count_per_wave * (wave-1)) * (count_player_base + count_per_player * players):
# x0.33 alone, x0.56 for two, x0.78 for three, x1 for four.
count_base = 13
count_per_wave = 1.8
count_player_base = 0.11
count_per_player = 0.2225
# Most enemies alive per wave; beyond this, extra enemies become extra health.
count_cap = 60
# Share of a wave that spawns elite, and how much tougher elites are.
elite_share_base = 0.05
elite_share_per_wave = 0.008
elite_share_cap = 0.30
elite_health = 5.0
elite_damage = 2.0
elite_scale = 1.35
# A boss every boss_every waves, with this many times a normal enemy's health.
boss_every = 5
boss_health = 12.0
boss_health_per_extra_player = 0.5
# Seconds between spawns on one lane.
spawn_interval = 1.1
# The endless stream: every open lane whose base isn't claimed sends one more enemy every
# stream_secs during a wave and every stream_rest_secs between waves (solo; faster with more
# heroes), up to stream_cap alive.
# It starts at stream_from_wave. Stream enemies don't hold up the end of a wave and give half
# the experience and gold.
# Claiming a base shuts its stream off.
stream_from_wave = 2
# Waves march fast down the long lanes (x1.5, +0.03 a wave, at most x1.9) and slow to their
# own pace once they pick a fight or come within march_until yards of the Ancient.
march_speed = 1.5
march_speed_per_wave = 0.03
march_speed_cap = 1.9
march_until = 50.0
# Before stream_ramp_waves it comes 1 + (stream_ramp_waves - wave) / 3 times slower (x3 at wave 2).
stream_ramp_waves = 8
stream_secs = 5.0
stream_rest_secs = 9.0
stream_cap = 24
# A hero alone (no one to cover the other bridge): enemies have solo_health and solo_damage of
# their usual health and damage, the stream comes solo_stream_slower times slower, and only
# solo_stream_cap of stream_cap of it is alive at once.
# A party: each hero past the first adds party_health to enemy health and party_damage to their
# damage, and spawns come party_spawn faster (four heroes cover, heal and stand by each other:
# for four, x1.6 health, x1.6 damage, and spawns 1.9 times as fast).
party_health = 0.2
party_damage = 0.2
party_spawn = 0.3
solo_health = 0.85
solo_damage = 0.85
solo_stream_slower = 1.6
solo_stream_cap = 0.5
# [first wave, lanes]: waves 1-3 use 2 lanes, then 3, then all.
lanes_by_wave = [[1, 2], [4, 3], [9, 4]]

[bases]
# Bases open for expeditions from this wave of the first cycle.
open_from_wave = 3
# Guardians at each base: one elite of `guardian_elite` and `guardian_adds` of the wave's enemies.
guardian_elite = "golem"
# (A swarm to push through: many, each a little weaker than a wave's enemy.)
guardian_adds = 8
# Guardian health is this many normal enemies' worth, times (1 + guardian_per_claim per base already
# claimed this cycle).
guardian_health = 1.6
guardian_per_claim = 0.15
# Guardians stay within this many yards of their base.
leash = 35.0
# Channel to claim a base, in seconds. Hits push it back a quarter second each (2 seconds at most);
# moving breaks it.
channel_secs = 6.0
# A claimed base sends this much smaller a share of its lane's enemies.
lane_cut = 0.4
gate_display = 11659
cache_display = 9832
banner_display = 14542
claimed_display = 14541

