# The Ancient's defences, bought with gold at the Ancient (right-click it). They stand in the world
# around it: Treant Protectors hurl bolts at enemies in reach, Healing Springs heal everyone near
# them (and the Ancient a little), Basin Defenders fight at its feet. Fortifying adds
# upgrade_bonus to all their damage and healing per rank. Costs are listed one per building.
# Damage is a share of a normal enemy's health this wave (reference_health, scaled like enemies).
# The hunter's pet (a wolf): a bite's share of the hunter's hit every 2 seconds, its health as
# a share of the hunter's, seconds to return after it falls, run speed, look.
[pet]
damage = 0.45
health = 0.7
respawn = 12
speed = 8.0
display = 780
scale = 1.0
name = "Wolf"

[defenses]
reference_health = 300
protector_costs = [50, 100, 170, 260]
spring_costs = [80, 180]
defender_costs = [30, 50, 75, 105, 140, 180]
protector_ring = 11.0
spring_ring = 9.0
protector_range = 32.0
protector_secs = 1.6
protector_damage = 0.06
protector_spell = 5176
protector_display = 1921
protector_scale = 0.6
spring_radius = 14.0
spring_heal = 0.025
spring_hub_heal = 0.0015
spring_spell = 5394
spring_display = 2030
spring_scale = 1.6
defender_damage = 0.08
defender_display = 164
# The longsword they swing (an item display): the guard model has no unarmed attack.
defender_weapon = 1928
upgrade_cost = 120
upgrade_growth = 1.5
upgrade_bonus = 0.2
# Defences and the Ancient's upgrades are shared: each hero past the first adds this share to
# their price (x2.5 for four), as every hero earns gold from every kill.
party_price = 0.5
# Enemies attack defences they pass within `aggro` yards of. Toughness is in normal-enemy
# healths at the current wave; everything standing is mended between waves.
protector_health = 9.0
spring_health = 12.0
defender_health = 6.0
aggro = 9.0
# A defence holds at most this many enemies at once: more than that and the rest march on past
# it, to the next defence, a hero or the Ancient (one soldier can't hold a whole wave). Each
# Promotion lets a defender hold one more.
