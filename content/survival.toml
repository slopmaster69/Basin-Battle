running = { from = "ScourgeMale", clip = 19, take = 1, recovery = 1.1, damage = 1.2, lunge = 2.8 }
roll = { from = "ScourgeMale", clip = 19, take = 2, windup = 0.85, recovery = 1.1, damage = 1.1, lunge = 1.8 }
leap = { from = "ScourgeMale", clip = 18, take = 0, windup = 0.9, recovery = 1.35, damage = 1.4, stamina = 1.3, lunge = 4.0, range = 1.1 }

# The guard breakers. An attack with the guard up bashes with the shield (with a two-handed weapon,
# it kicks); a heavy attack with the guard up kicks. Either knocks a creature's wind-up aside (a
# boss's only when it's a cast: `shove_bosses`) and tears `guard_break` stamina from a raised
# guard (breaking it if that's more than is left), and shoves a hero back (speed, lift).
[bash]
clip = 59
windup = 0.2
active = 0.1
recovery = 0.4
stamina = 13.0
damage = [4, 7]
range = 2.5
arc = 100.0
stagger = 0.7
guard_break = 45.0
push = [6.0, 1.5]
lunge = 0.6

[kick]
clip = 95
windup = 0.22
active = 0.1
recovery = 0.45
stamina = 10.0
damage = [0, 0]
range = 2.4
arc = 80.0
stagger = 0.45
guard_break = 60.0
push = [8.0, 2.0]
lunge = 0.4

[lock]
# The soft lock. A swing turns toward a foe up to this many degrees past the weapon's own arc (each
# side) when nobody is inside it; a quick shot (a click without aiming) toward a foe this near the
# facing.
melee = 35.0
shot = 10.0

[parry]
# Raise the guard this short a time before a blow lands and it's parried: no damage, no stamina,
# and the attacker reels. (Ranged blows can only be blocked.)
window = 0.25
# Only if the guard was down at least this long first: tapping it constantly parries nothing.
cooldown = 0.6
# The attacker reels this long, and takes this much more from every blow meanwhile.
stagger = 1.4
riposte = 1.5
# A hero whose blow is parried (by another hero) reels this long.
hero_stagger = 0.9
# The parry pays: this much stamina back, and for this long after, every blow, roll and guard
# costs half (the opening to answer with).
stamina = 25.0
opening = 2.0
# A boss isn't stopped by a parry: in a group parries came so often it reeled forever. Each parry
# fills this share of its posture instead (on its bar); a few in a row, or parries and blows
# together, break its stance. Lesser champions with a posture still reel from a parry.
posture = 0.25

[backstab]
# A hit in a creature's back, by anyone: besides the stab (kit 330, which plays on the chest and so
# shows nothing from behind), the dagger's crit and the beat, this look on the creature. Rend's
# blood burst; to film another, .es tune backstab.kit <id> (290, 815, 3051 are the same burst as
# other blows play it). 0 for none.
kit = 220

# The ice shattering off a frozen foe: one look for every class, whoever's ability shatters it.
# With the frost burst (kit 450), the ice-breaking sound and the biggest beat, a short pale burst
# of action lines on the foe (a spell visual kit; 0 for none). None seen on video yet; to try
# another in play: `.es tune shatter.burst_kit 487`. 121 Holy_ImpactDD_Low_Chest (a small
# white-gold flash with radial spikes at the chest); 487 Exorcism_Impact_Chest (a bigger holy
# burst, yellow-white rays); 3381 starfire_area (Starfire's white-blue starburst, the biggest, at
# the foe's base); 283 LightningBolt_Impact_Chest (a white-blue electric flash).
[shatter]
burst_kit = 121
[ward]
# The ward: a staff's guard (a `[[shield]]` with `ward = true`). An arcane barrier with a bar of
# its own in place of stamina. Every blow it stops drains the bar by the guard's costs; a guard
# raised in the parry window is a perfect ward, which costs nothing, gives some of the bar back and
# reels the attacker as a parry does (a hero's blow, too); a blow too heavy for what's left breaks
# it, and a broken ward can't go up again until the bar is full. The bar refills while the ward is
# down, never while it's up, so a caster who wards everything runs dry and one who times it well
# wards the longest. (The Mage design, claude/mage-kit-draft.md.)
bar = 100.0
refill = 35.0
refill_delay = 0.4
perfect_refill = 20.0
break_secs = 1.0
# The looks. Corey's playtest (Nov 5): the ward was cluttery and the arm never showed. Arcane
# Power's crackle round the chest (12042) hid the body, and the steady crackle while up added to
# it. Now nothing wraps the body: the arm is held out (`clip`, the channelled cast on the upper
# body) with Polymorph's swirl in the hand (`hold_spell`), and how much is left shows on the
# warder's own reticle (the cracking arc, Ward.lua). Counterspell's crackle on it only as a blow is
# stopped (381); Arcane Explosion's violet burst for a perfect ward (1005). Breaking reads as a
# debuff (Corey: Mana Burn's fizzle looked like a cleanse): Curse of Weakness's dark burst on the
# head as it goes (311), and Curse of Tongues' look on the warder until the bar is whole again
# (1714). The barrier itself is drawn round the body by the add-on (Ward.lua, `WB`).
aura = 0
block_kit = 381
hold_spell = 118
clip = 124
clip_hold = 8.0
clip_body = "upper"
# The human man's take on every race and gender (Corey: race-locked).
clip_from = "HumanMale"
# No crackle while it's merely up (0); the arc on the reticle cracks as it drains instead.
crackle_full = 0.0
crackle_empty = 0.0
perfect_kit = 1005
break_kit = 311
broken_aura = 1714

[staffs]
# What a casting staff's plain bolts build and its heavy bolt spends (Corey's playtest, Nov 5: the
# staffs should feel apart from their school's spells, so the spells keep the skill checks and the
# staffs build and spend). Ember heats the foe it hits and the third heat ignites; Rime chills it,
# slower with each, and the third freezes it; Arcane gathers charges at the caster's staff. The
# heavy bolt spends them, 20% harder for each (Arcane's orb by `charge_scale`).
most = 3
keep = 5.0
# Balance, Nov 5 review: 40% each made a 2-heat heavy outhit the spells (61 against Fireball's 36).
spend_share = 0.2
# The ignite: 14 damage within 2.5 yd with the bolt's burn, Blast Wave's burst on the foe.
ignite_damage = 14.0
ignite_radius = 2.5
ignite_spell = 11113
chill_slow = 0.15
freeze_secs = 1.5
# The last charge gathering: Blink's violet flash at the hands; all of them spent throw the foe back.
charged_kit = 3394
charged_knockback = 3.0
# The Arcane heavy orb by the charges it carries: nothing, 35%, 60%, all of it; its look Arcane
# Missiles' orb of each rank, drawn bigger with each (`[[missile_look]]` 7268, 7269, 7270); with
# all three, Arcane Explosion's burst on what it strikes.
charge_scale = [0.0, 0.35, 0.6, 1.0]
charge_spells = [0, 7268, 7269, 7270]
charge_full_kit = 1005
# The ice made plain (Corey: hard to see): the frost burst on a foe the third chill freezes, and
# Cone of Cold's spray on each chill.
freeze_kit = 450
chill_kit = 1027

[checks]
# The skill checks built into spells. The release: a charged spell with `perfect = true` flares
# as its window opens, and a release within `window` of the charge's top is a perfect cast: full,
# `perfect_damage` times more, `perfect_valor` to the caster (a parry's), and a burst on them that
# everyone sees. Let go earlier it goes at its charge, as ever; held past the window it's full and
# no more. A missed check is still a working spell. (The Mage design, claude/mage-kit-draft.md.)
window = 0.1
perfect_damage = 1.2
perfect_valor = 10.0
# The burst for a check without its own (`perfect_kit` on the ability: each school's ring).
perfect_kit = 1004
# The flare comes, at random, from this share of a ranged charge's top to the top (a fixed
# charge's up to `flare_late` sec after it), so no two casts keep the same time; the critical is
# the middle `crit_share` of a window. A fizzle (all or nothing, missed) shows Dispel's puff.
flare_from = 0.72
flare_late = 0.35
crit_share = 0.3
fizzle_kit = 226

[priest]
# The Priest's staffs and perfects (docs/priest-draft3.md). Searing Light: a Smite marks its foe
# for 5 sec; any other Priest spell (or a Greater Smite) striking the marked foe tears it out for 8
# more, and Healing Gust's recharge jumps 3 sec. Shadow Weaving: each Shadow Bolt weaves a stack
# into its foe, up to 5 for 6 sec, each 8% more for the staff's bolts on it; 2 sec without a bolt
# and the next is Empowered (half again as fast, 10 yd farther, 1.5 times as hard, 4 Valor).
# Every Light perfect is a column of holy light on the hero (Holy Light's impact, kit 431; Holy Nova's
# ground burst flooded 10 yd and read as an area spell), a Shadow one Void Blast's burst (each Shadow
# spell's own `perfect_kit`); never the Mage's Arcane Explosion.
sear_secs = 5.0
sear_damage = 8.0
sear_refund = 3.0
gust = "healing_gust"
# Holy Fire's flash on the foe as the mark is torn out.
sear_kit = 3153
weave_most = 5
weave_secs = 6.0
weave_step = 0.08
weave_after = 2.0
empower_speed = 1.5
empower_range = 10.0
empower_damage = 1.5
empower_valor = 4.0
# Shadowform's dark swirl at the Priest's feet while the next bolt waits, Empowered.
empower_aura = 15473
perfect_kit = 431

