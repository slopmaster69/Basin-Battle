# Q, the second choice: the arrow that reads the room. Off a wall or a tree it comes away harder
# (`bounce_gain` of its damage more a bounce) and goes through the first foe it meets after; into
# the ground at a low angle it skips off, no harder. (Rocks aren't solid to the rules yet.)
[[ability]]
key = "bank_shot"
name = "Bank Shot"
text = "Fires an arrow that ricochets off walls and trees up to 2 times, and skips off the ground at a low angle. Each ricochet adds 8 damage. An arrow that has ricocheted pierces the first enemy it hits. It plants where it finally stops."
