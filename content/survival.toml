# ============================== the nine classes' new cards ==============================
# Durations are a creature's: a hero gets half of any crowd control (and the grace after a stun,
# an incapacitate or a fear). Numbers are tuned against a 200-health hero.

# ---------------------------------------------------------------------------------- Warrior --

[[ability]]
key = "heroic_leap"
name = "Heroic Leap"
ex_of = "charge"
text = "Leaps to the target location up to 16 yd away, over obstacles. Enemies within 4 yd of the landing take 12 damage, are knocked back 5 yd and slowed by 40% for 2 sec."
icon = "Ability_WarStomp"
slot = "utility"
kind = "leap"
valor = 25
range = [16.0, 16.0]
radius = [4.0, 4.0]
damage = [12.0, 12.0]
lift = 7.0
# No ring where it comes down: nobody sees the landing coming (a rival under it is still warned).
unmarked = true
# The weapon held high through the jump: the Forsaken men's slow two-handed overhead (19/0) runs
# over the whole airtime (a leap's clip is twice its airtime), so the weapon is up over the head
# all the way and comes down as the hero lands. Corey's review: no more weapons held idle in
# the air. The same clip as Sundering Blow's, at the leap's own pace.
clip = 19
take = 0
from = "ScourgeMale"
spell = 16979
impact_kit = 5089
effects = [{ kind = "knockback", amount = 5.0 }, { kind = "snare", secs = [2.0, 2.0], amount = 0.4 }]

# ----------------------------------------------------------------------------------- Hunter --
# The archer who owns the ground: every arrow that ends its flight sticks where it stops (`plants`:
# 6 s, 12 at most) and Arrow Recall brings them all back through the fight. Two choices a row
# (`choice = 2` is the second), each with its EX.

# Q: the sniper's shot: hold the click to draw. (Its key isn't `aimed_shot`: that's the bow's shot
# on the bench.)
[[ability]]
key = "aimed_arrow"
name = "Aimed Shot"
text = "Hold to draw your bow for up to 1.4 sec, then release to fire for up to 120% bow damage. Damage, range and arrow speed increase with the draw. A full draw pierces every enemy in its line. A heavy hit on you cancels the draw. The arrow plants where its flight ends."
icon = "INV_Spear_07"
school = "hunter"
slot = "ranged"
bow = true
kind = "projectile"
charge = [0.0, 1.4]
fragile = true
# Serg's play-test (#118): it grows with the bow, as an art grows with the weapon. 120% of the
# bow's damage at the same draw: 14–36 with the hunting bow (12–30), as it was.
