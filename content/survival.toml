# --- enemies --------------------------------------------------------------------------------------
# The Horde has taken the Fargodeep mine yard and camps by the road to the west. Its fighters are
# men and women of the Horde with real weapons, and they fight like the hero does: strings of
# blows (`[[mob.pattern]]`, one picked each time by how far off you are), each with its wind-up
# you can read (its clip slowed to it on the action-combat client, a mark on the ground where it
# will land), and a recovery to punish. Some lunge in from farther off; some hold a heavy blow back
# to catch an early dodge; shield-bearers take light blows on the shield between attacks. Every
# step of a pattern is the creature's `attack` with its own changes (`clip` and `take` the swing,
# `lunge` yards stepped into it). `blockable` blows can be met with a shield; `heavy` ones cost far
# more to block and, from a heavy fighter, put a hero down; `poise` keeps a wind-up from being
# knocked aside by a light blow.
#
# The beasts of the forest (boars, wolves, the bear) are wildlife, hunted for meat and hides.

[[mob]]
key = "boar"
name = "Stonetusk Boar"
display = 703
scale = 0.9
health = 70
run_speed = 8.0
walk_speed = 2.5
aggro = 0.0
leash = 30.0
drops = { meat = [2, 3], hide = [1, 1] }
respawn = 120.0
  [mob.attack]
  windup = 0.6
  damage = 12
  range = 2.6
  arc = 90.0
  recovery = 0.9
  cooldown = 1.4
  # During the wind-up it turns this fast; for the last `lock` seconds it doesn't turn at all.
  turn_rate = 240.0
  lock = 0.25
  blockable = true
  # A gore with the tusks.
  [[mob.pattern]]
  name = "gore"
  weight = 3.0
  steps = [ { clip = 16, take = 0, windup = 0.55, damage = 12 } ]
  # Two gores, the second quick on the first.
  [[mob.pattern]]
  name = "two gores"
  weight = 1.5
  steps = [ { clip = 16, take = 1, windup = 0.5, damage = 10, recovery = 0.2 }, { clip = 16, take = 0, windup = 0.38, damage = 12, recovery = 1.0 } ]
  # From farther off, a charge.
  [[mob.pattern]]
  name = "charge"
