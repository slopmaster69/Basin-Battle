    { mob = "shaman", from = 4, cost = 0.9 },
    { mob = "witchdoctor", from = 4, cost = 0.9 },
    { mob = "bear", from = 4, cost = 1.4 },
    { mob = "deathguard", from = 6, cost = 1.3 },
    { mob = "brave", from = 7, cost = 1.8 },
    { mob = "overseer", from = 8, cost = 2.2 },
