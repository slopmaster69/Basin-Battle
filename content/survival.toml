growth = 0.8
per_hero = 0.5
most = 7
toughen = 0.05
boss_every = 5
bosses = ["captain", "shadowhunter", "hogger", "warlord", "rakgash"]
roster = [
    { mob = "boar", from = 1, cost = 0.6 },
    { mob = "wolf", from = 1, cost = 0.6 },
    { mob = "grunt", from = 1, cost = 1.0 },
