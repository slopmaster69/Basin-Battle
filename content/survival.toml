# --- abilities ------------------------------------------------------------------------------------
# Past the sword and shield, four keys, each a row of four cards to choose from (the board, N):
#
#   Q  ranged    reach the foe: aimed along the reticle, most of them charged with left click
#   E  close     in the brawl: weapon arts and spells for arm's length
#   R  utility   engage, escape, survive or control
#   F  ultimate  the whole Valor bar; hold the key a moment to unleash it
#
# The four columns lean four ways (Steel the duelist, Shadow the hunter, Elements the battlemage,
# the Warden light and nature), but any card goes with any other. Holding Q, E or R a moment (or
# Ctrl with it) casts its charged-up EX version for Valor. Abilities set things up for each other:
# a Mark makes the next hit land harder (and Backstab crit), fire and Sundering Blow shatter a
# frozen foe, and abilities on a foe reeling from your parry hit as a riposte does.
#
# Every projectile flies at its 1.12 visual's own speed and strikes the first thing it touches, so
# a step aside after the throw makes it miss. Numbers are starting points for tuning:
# `.es tune ability.fireball.damage [20, 40]`.
#
# `bench = true` keeps an ability out of the board (its mechanics stay, for tests and for putting
# back on the board later; `.es slot` puts one on its row's key in a dev build).

[dev]
# Every card unlocked from the start (a dev world for trying them all). With it off, a new hero
# knows their class's Q and E cards (the class picked on the creation screen; `start.cards`), and
# learns the rest out in Elwynn, each hero for themselves: each class's shrine teaches its Q and E
# (another class's, for most who use it), a hidden relic its 1 and 2, its champion its 3 to
# everyone who fought it (the board says where). Heroes saved before keep what they had.
full_tree = false

[valor]
# The bar, its segments (an EX version costs one or two) and what each life starts with. An
# ultimate takes the whole bar.
max = 100.0
segment = 25.0
start = 25.0
# What fills it: a light hit, a heavy, an ability's (each its own `valor_hit` over this), a parry,
# rolling through an attack, a counter that catches something, a kill.
light = 2.0
heavy = 6.0
ability = 6.0
parry = 10.0
roll = 8.0
counter = 15.0
kill = 3.0

[cc]
# Heroes get this share of the duration creatures do, and after a stun, incapacitate or panic
# can't get another of those three for this long.
player_share = 0.5
grace = 3.0
# A panic ends once it's taken this share of the panicked one's health; a frozen foe's ice takes
# this much before it breaks; a panicked hero is driven away this fast.
panic_break = 0.15
petrify_shield = 40.0
panic_speed = 5.0

[loadout]
ranged = "aimed_throw"
close = "sundering_blow"
utility = "charge"
defense = "retaliation"
ultimate = "onslaught"

