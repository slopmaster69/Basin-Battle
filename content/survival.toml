# Elwynn Survival: every number the game plays by. Times are seconds, distances yards, angles
# degrees, positions Elwynn's own world coordinates (x north, y west). Stamina, health and costs
# are whole points. Change anything and restart the server.
#
# The loop: prepare in the camp by Goldshire, go out for wood, food and ore, decide when to turn
# back, bank what you carry at the camp's storage chest, and build stations that change what the
# next trip can do. Everything here is a prototype default, tuned by playing.

# --- the settlement -------------------------------------------------------------------------------

[world]
# The camp is Westbrook, on Elwynn's western road: the garrison is gone (its barracks taken out of
# the land, `WESTBROOK_EDITS` in crates/htl-map/src/elwynn.rs and client patch 0019), and the
# survivors camp on its level yard, the lion statues at the old gate to the south, the road from
# the gate down to the Westfall road. The camp's things stand in their places round the fire
# (`[[prop]]` below, "the camp as it grows"); stations go up in the yards round them.
#
# Where heroes arrive and get back up: just inside the gate, facing the fire.
spawn = [-9640.0, 688.0]
spawn_facing = 0.0
# The camp's heart: the storage chest stands here, among the camp's stores north-west of the
# fire, and resting near it heals.
heart = [-9617.0, 698.0]
rest_radius = 16.0
# The alarm bell, on its frame inside the gate: ring it to call the settlement attack.
alarm = [-9647.0, 676.0]
# Where stations may be built: the old garrison yard round the camp's fire, ringed by torches
# (`build_marker`, one about every `build_marker_every` yards); while placing one, the add-on lays
# the whole ground out in green. The camp's own things keep their ground (`clear`).
build_center = [-9624.0, 688.0]
build_radius = 42.0
build_marker = 4094
build_marker_every = 14.0
# Nothing is built on a road, on the arrival spot, the chest, the bell, or within this of them.
keep_clear = 4.0
# The weapon rack in the muster yard by the gate: take up any weapon to try it (free while
# `armory` is on).
rack = [-9640.0, 671.0]
armory = true
# Their looks, a size a hero reads from across the camp: the chest (Chest01, twice its size), the
# bell on its frame (the ship's bell), the rack a third bigger, and the Logbook on a table (its top
# a yard up).
storage_display = 10
storage_scale = 2.0
alarm_display = 4052
alarm_scale = 0.75
rack_display = 130
rack_scale = 1.3
book_stand_display = 234
book_stand_scale = 0.8
book_stand_height = 1.05
# Elwynn is always night: the game clock pinned at half past eleven (hour, minute) and set again
# every `clock_every` seconds, so it never runs on to the dawn. Elwynn's own Light.dbc night is
# moonlit blue, dark enough to feel it and light enough to read a fight. Take the line out for the
# time it is now. Not below (a dungeon has its own light) nor in Siege.
clock = [23, 30]
clock_every = 300.0
# Duskwood's mist over the night, asked of the client by the add-on (a client without patch 0018
# keeps Elwynn's own): a grey-blue fog closing in at 120 yards, a third of the way from the eye,
# laid fully over Elwynn's and the light a quarter darker. Thicker while a raid is called.
fog = { color = [0.20, 0.23, 0.30], end = 120.0, start = 0.25, weight = 1.0, darken = 0.25, secs = 8.0 }
raid_fog = { color = [0.24, 0.18, 0.18], end = 80.0, start = 0.15, weight = 1.0, darken = 0.35, secs = 12.0 }

# --- the hero -------------------------------------------------------------------------------------

[player]
health = 200
stamina = 100.0
# Stamina comes back this fast, once this long has passed since it was last spent.
stamina_regen = 32.0
# (0.8 felt like a wall between trading blows: half a second keeps a rhythm.)
stamina_delay = 0.5
# Below this stamina nothing that costs any can start (a short vulnerable spell, not a wait).
exhausted_below = 1.0
run_speed = 7.0
# Sprinting (hold Shift while moving): this fast, draining this much stamina a second (a way
# across the world, not a fight's cost: a full bar runs half a minute). At 11 and above the
# client plays the hero's Sprint clip (143) over Run, the body leaning into it: a little over, so
# a strafe's speed, measured a frame at a time, never dips under and flickers between the two.
sprint_speed = 12.0
sprint_drain = 3.0
# Run dry and the sprint stops; it starts again only with this much stamina back.
sprint_restart = 10.0
# A jump costs this much stamina, and takes at least that much to make.
jump_stamina = 8.0
# Turning with A and D, radians a second (the game's own is 3.14): quick enough to aim by.
turn_rate = 4.0
# How fast a hero moves while committed: swinging, guarding, aiming, eating.
attack_speed = 3.0
guard_speed = 3.5
aim_speed = 3.0
use_speed = 2.5
# The clips a hero plays using an item marked `anim = "eat"` or `anim = "drink"`, over its
# `use_secs`, on every client that plays clips (`/esclip 61` tries one on yourself). 61 is
# EmoteEat, the 1.12 client's /eat. The 1.12 client has no drinking clip of its own (its /drink
# plays EmoteEat as well), so a drink plays the same until a better one is found; 0 falls back
# to the Food spell's cast.
eat_clip = 61
drink_clip = 61
# Health back a second, as a share of max: anywhere (the field, below, Siege) once this long has
# passed since the hero last dealt or took a blow, and resting at the camp (never during the
# settlement attack). In a fight only gear, set bonuses, food and heals bring health back.
# On trial (#118, Corey's call): 2% a second from 5 sec out of combat, to recover between pulls
# without making everyone full before the next fight, so healers still matter. Try it on the
# next dungeon run and tune. (Was 0.4% a second from 10 sec, which barely registered.)
field_regen = 0.02
field_regen_after = 5.0
rest_regen = 0.08
respawn_secs = 6.0
# Health on getting back up.
respawn_health = 0.6
# An input pressed this close to the end of a swing waits for it instead of being lost.
buffer = 0.25
# A hero in combat this long ago is out of combat.
combat_secs = 5.0
# How many stacks the bags carry: the backpack's 16, the rest shared out over four satchels
# (at most 36 each).
bag_slots = 80

[dodge]
stamina = 15.0
# A roll takes at least this much stamina to start (not a sliver).
min_stamina = 18.0
secs = 0.45
# Attacks that land between these times (from the dodge's start) miss.
evade_from = 0.04
evade_to = 0.32
# The dash, with a direction held: this fast along the ground for this long (about 4 yards). It's
# a burst of run speed, so it follows the ground like walking; no keys held, a short hop back.
speed = 16.0
dash_secs = 0.25
back_step = [8.0, 3.0]
# A spell's look to mark it, 0 for none. None: Sprint's (2983) played its whoosh and a blue trail
# on every roll, and Charge's (100) trailed a long red ribbon. `.es fx spell <id>` tries another
# on yourself.
spell = 0
# Rolling through a blow, not just rolling: a little breath back, the reward for reading it.
refund = 10.0

[heavy]
# The heavy attack (Shift + left mouse): the weapon's wind-up and recovery this much longer, its
# damage and stamina this much more. It staggers a creature caught just after its own blow (at
# least this long; never a boss), shows as a critical, and throws a hero it lands on back (this
# fast, this high).
windup = 1.55
recovery = 1.2
damage = 1.7
stamina = 1.6
stagger = 0.6
knockback = [9.0, 2.5]

[combat]
# Every foe's health, as a share of its own `health` (critters, dummies and totems as they are):
# 1.6 makes a fight last about 60% longer than the numbers below say (the classes' cards hit
# hard). A creature's posture, its blows and its damage stay as they are.
foe_health = 1.6
# Every foe's blows (and burns) on a hero: this many times the damage written below.
foe_damage = 1.35
# For each hero in a foe's fight past the first (anyone standing within 25 yards of it, or on it
# from farther off), it has this share more health and its blows this share more damage. It grows
# as heroes join and stays grown until it's home again. Below, every hero in the mines counts
# (`hero_health` in deadmines.toml); the arena sends more foes instead.
hero_health = 0.7
hero_damage = 0.1
# A heavy blow doesn't knock a creature's wind-up aside: you don't stop it by hitting first. Only
# a weapon made for it (one with its own `stagger`: a mace, a maul, an axe) does, and then not
# again for `knock_aside_wary` seconds, and never a boss's. Dodge the blow or guard it, then strike
# in the window after it: a heavy blow then staggers it (`recovery_stagger`; never a boss), and
# every blow then counts this many times towards breaking a champion's stance. A bash or a kick
# still knocks a creature reeling (a boss only out of a cast); a parry and a broken stance still do.
heavy_knocks_aside = false
knock_aside_wary = 8.0
boss_knock_aside = false
recovery_stagger = true
recovery_posture = 1.5
# Bosses are drawn (and struck) this much larger than their own scale: bigger than life, to
# loom over a group and so their wind-ups read from farther off (play-test).
boss_scale = 1.35
shove_bosses = false

# An attack pressed this far into a light blow's recovery (a share of it) chains into the next
# blow of the set at once; earlier, it waits for the end (the buffer).
chain_after = 0.25
# A dodge or the guard this far into a blow's recovery cuts the rest short (a heavy attack's, the
# second): you're committed to the swing itself, not all of its follow-through.
cancel_after = 0.45
heavy_cancel_after = 0.65
# The chain carries on if the next attack comes within this long of a blow's end.
combo_grace = 0.6
# A lunge runs over this long, ending as the blow lands.
lunge_secs = 0.18
# Lag: a swing judges where the others were when its striker saw them (up to this far back), and
# a blow on a hero waits up to this long (their round trip) for a dodge or guard they'd already
# pressed when they saw it coming.
max_rewind = 0.25
max_grace = 0.2
# Leaning back from a blow (radians): a light one, a heavy one.
lean_light = 0.22
lean_heavy = 0.45
# Poise: a heavy attack, from its start until it lands, isn't knocked aside or thrown back by a
# light blow (a heavy blow, a bash or a kick still do it). Creatures with a heavy blow are poised
# the same way while they wind it up (`poise` under `[mob.attack]` says otherwise).
heavy_poise = true
# Knocked down (a guard broken by a heavy blow or a kick, a heavy creature's blow landing): on the
# ground this long, open to a riposte.
knockdown = 1.5
# A blow on a body reeling from any stagger of yours (a bash, a kick, a wind-up knocked aside, a
# knockdown) is a riposte: the parry's riposte damage, with Backstab's flash.
riposte_any_stagger = true
# Stamina doesn't come back during a blow or a dodge: its pause starts as they end.
stamina_waits = true
# A blow on a creature from behind (more than 120 degrees off its facing): this many times the
# damage, with Backstab's flash. Get round the ones that circle you.
backstab = 1.5

[ai]
# How creatures fight a band of heroes, as Yharnam's beasts and hunters do. Every so often
# (between strings, never mid-string) a creature looks round for whom it would rather fight: the
# damage a hero has done it lately (a share of its health, fading by half every `threat_half`
# seconds) times `threat`; `opening` more for a hero with their guard down (eating, working,
# gathering, in a swing's follow-through, drawing back or casting a spell, reeling); `wounded`
# times how hurt they are; `distance` less for every 10 yards off; `crowd` less for each other
# creature already on them (a pack spreads over a band: the same weighs as 10 yards, so a foe
# walks a few steps to a hero nobody's on); `stick` more for its foe now, so it doesn't turn
# every second. A pack drawn in spreads the same way as it comes, and one with no turn at its
# hero (two pressing them) goes for a hero nobody's pressing. A raider on its way to a station
# turns on a hero who comes near it.
retarget_secs = 1.2
threat = 3.0
opening = 1.0
wounded = 0.8
distance = 1.0
# (Was 0.6 past the first: four foes still stacked on whoever pulled. Play-test: spread them.)
crowd = 1.0
stick = 0.8
threat_half = 8.0
# An opening within 7 yards: it comes at once, up to `press_early` seconds before its cooldown is
# done, and past the two-at-a-time turn the others wait for.
press_early = 1.2
# Against a raised guard, a string with a blow no guard stops (or a heavy one that tears at the
# guard) is this many times as likely.
guard_break = 3.0
# After a string, the chance a fighter gives ground (not a boss, nor one that shoots), backing
# off this far facing you: come to it, or wait it out.
retreat = 0.3
retreat_yards = 4.0
# Waiting its turn, it works round toward your back (the shorter way round).
flank = true
# Its cooldown between strings, give or take this share: no metronome to learn.
jitter = 0.25
# Every foe's leash (its own `leash`, how far from home it chases) times this, in the open and
# below. (Play-test: foes ran home far too soon; four times. Most leashes are 30 yards, so about
# 120: a dungeon's packs stand 15 to 40 yards from the next (25 the middle, up to 95 in the
# Wailing Caverns' long caves), so a pack follows you through two or three rooms, into the next
# pack's, before it gives up. A wager's farther chase, 1.75, is the farther of this and its own:
# this one, now.)
leash_scale = 4.0

# Each grip's blows. `clip` is the game's own animation (AnimationData id) and `take` which of the
# model's versions of it; `windup` and `recovery` are shares of the weapon's own times, `damage`
# and `stamina` shares of its own, `lunge` how far the hero steps into it (yards), `range` a share
# of its reach. The light blows chain in order and start over after the last; `running` is an
# attack while sprinting, `roll` one pressed during a dodge (it comes as the roll ends, quick, a
# step on), and `leap` one pressed in the air out of a Corey roll (a jump taken in the dodge's
# dash, which carries the dash's speed): it strikes as the hero lands, long and heavy, with a
# long recovery for it. Without `roll`, the running attack; without `leap`, `roll`.
# `from` plays another character model's take on the clip on the hero's own
# body (`from = "ScourgeFemale"`: Undead female's; <Race><Gender>, the races Human, Orc, Dwarf,
# NightElf, Scourge, Tauren, Gnome, Troll, Goblin), on a client that can (ac10; the rest play their
# own). A creature on a character model takes `clips_from` for all its blows, or a step's own
# `from`. scripts/race-clips.sh lists every model's clips, and /esclip tries one in game.
#
# Every hero's blows are one model's, whatever their race, so the same blow reads the same on
# everyone (a night elf woman's own heavy attack was a spinning flourish, a human man's a spin
# too, a dwarf's a sideways sweep). Picked from the clip census by tools/clip-census/heroes.py:
# grounded takes only (no flip or spin; a leap only on the leap attack), light blows clear cuts,
# heavy blows an overhead or a chop. Undead male for the sword, axe, mace, two-hander and polearm
# (a chop, an overhead, the polearm's slow overhead for every heavy), dwarf male for the dagger
# (quick thrusts and a wide sweep). Rerun the picker after a new census; edit by hand freely.
[[moveset]]
key = "one_hand"
light = [
  { from = "ScourgeMale", clip = 17, take = 1, lunge = 0.7 },
  { from = "ScourgeMale", clip = 17, take = 2, recovery = 1.05, lunge = 0.7 },
  { from = "ScourgeMale", clip = 17, take = 2, windup = 1.2, recovery = 1.25, damage = 1.35, stamina = 1.2, lunge = 1.0 },
]
heavy = { from = "ScourgeMale", clip = 17, take = 2, lunge = 1.0 }
running = { from = "ScourgeMale", clip = 17, take = 1, recovery = 1.1, damage = 1.2, lunge = 2.4 }
roll = { from = "ScourgeMale", clip = 17, take = 1, windup = 0.8, recovery = 1.1, damage = 1.1, lunge = 1.6 }
leap = { from = "ScourgeMale", clip = 17, take = 2, windup = 0.85, recovery = 1.35, damage = 1.45, stamina = 1.3, lunge = 3.6, range = 1.1 }

[[moveset]]
key = "dagger"
light = [
  { from = "DwarfMale", clip = 85, take = 0, lunge = 0.6 },
  { from = "DwarfMale", clip = 88, take = 0, lunge = 0.6 },
  { from = "DwarfMale", clip = 85, take = 0, windup = 0.9, lunge = 0.6 },
  { from = "DwarfMale", clip = 57, take = 0, windup = 1.2, recovery = 1.2, damage = 1.5, stamina = 1.2, lunge = 1.0 },
]
heavy = { from = "DwarfMale", clip = 57, take = 0, lunge = 1.0 }
running = { from = "DwarfMale", clip = 88, take = 0, recovery = 1.1, damage = 1.3, lunge = 2.4 }
roll = { from = "DwarfMale", clip = 88, take = 0, windup = 0.8, recovery = 1.1, damage = 1.2, lunge = 1.6 }
leap = { from = "DwarfMale", clip = 17, take = 0, windup = 0.85, recovery = 1.35, damage = 1.6, stamina = 1.3, lunge = 3.6, range = 1.1 }

[[moveset]]
key = "two_hand"
light = [
  { from = "ScourgeMale", clip = 18, take = 2, lunge = 0.8 },
  { from = "ScourgeMale", clip = 18, take = 0, recovery = 1.05, damage = 1.05, lunge = 0.8 },
]
heavy = { from = "ScourgeMale", clip = 19, take = 0, lunge = 1.2 }
running = { from = "ScourgeMale", clip = 18, take = 2, recovery = 1.1, damage = 1.2, lunge = 2.6 }
roll = { from = "ScourgeMale", clip = 18, take = 2, windup = 0.85, recovery = 1.1, damage = 1.1, lunge = 1.7 }
leap = { from = "ScourgeMale", clip = 19, take = 0, windup = 0.9, recovery = 1.35, damage = 1.4, stamina = 1.3, lunge = 3.8, range = 1.1 }

[[moveset]]
key = "polearm"
light = [
  { from = "ScourgeMale", clip = 19, take = 1, lunge = 0.8 },
