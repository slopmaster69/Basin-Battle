# A click sooner than this into the aim does nothing.
min_draw = 0.45
stamina = 8.0
# Damage at the least and the full draw.
damage = [12, 30]
range = 40.0
# How near the line of flight a target's middle must pass to be struck (plus its own size).
hit_radius = 0.45
arrow_speed = 45.0
# The release (AttackBow) plays out before the next arrow comes up.
recovery = 0.7
# The ranged slot's arrow visual (Auto Shot): its start draws and holds the bow, its go looses.
spell = 75
subclass = 2
# A click without aiming: a quick shot, loosed this long into its draw (weaker than a full draw).
quick_draw = 0.55
# Aimed shots fly along the over-the-shoulder camera's line, this far to the hero's right (on the
# action-combat client; it matches the camera the add-on asks for).
shoulder = 0.75

[[ranged]]
key = "crossbow"
# No draw: aim, click, and the bolt flies at full power; then a long reload.
draw_secs = 0.0
min_draw = 0.0
stamina = 6.0
damage = [34, 34]
range = 45.0
hit_radius = 0.4
arrow_speed = 60.0
recovery = 1.7
spell = 75
subclass = 18

