# each leg off a wall flies from where it struck. No burst where it strikes a wall (Corey's review:
# the Lava Burst's landing there read as the arrow going off in the inn wall; the arrow flown on
# from the wall, harder each bounce, is the bounce's look), and none off the ground either, so a
# skip doesn't read as an explosion (Corey's review, run 040): the data has no small splash of dirt
