ex_of = "aimed_arrow"
text = "Fires 5 arrows at once in a fan 5 yd wide where you aim, with no draw. Each arrow deals 60% bow damage and plants where it lands. Shatters frozen enemies. Free after a Freezing Trap."
icon = "Ability_UpgradeMoonGlaive"
