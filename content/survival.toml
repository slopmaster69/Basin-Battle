# === 2: defense ====================================================================================
# Staying alive: alone, the answer to a pack or a champion's big blow; in a duel, a read (each
# catches some things and not others) and a bait.

# Steel, the Juggernaut: no guard, no brace. The berserker shrugs off what holds them and keeps
# swinging (Momentum drops the moment they block), so its defense is getting back up.
# Berserker Rage is the answer to being caught: it goes off the ground and out of a stagger (the
# one key that works then), with 3 sec of poise after so the next blow of the same string can't
# put them straight back down.
[[ability]]
key = "berserker_rage"
name = "Berserker Rage"
text = "Breaks free of any stagger, knockdown, root or slow. You cannot be staggered for 3 sec. Usable while staggered or knocked down."
icon = "Spell_Nature_AncestralGuardian"
school = "warrior"
slot = "defense"
kind = "buff"
passive = "momentum"
free = true
breaks_free = true
# Long enough that when to spend it is a choice (a pack's next knockdown is coming), short enough
# to have it in most fights.
cooldown = 16.0
# Not red: Blood Fury is the red one (Corey's review, Nov 4: the two looked identical). The
# shrug-off is Unyielding Will's chest swirl (8099, "Stamina"'s look) as it goes, and the 3 sec
# carry no lasting mark (20572 has none); Enrage's burst (12880) and the red fists (18499) were
# Blood Fury's colours.
spell = 8099
# The berserker shrugging it off, the same on every race: the orc men's Flex emote (82/0), arms
# up and fists clenched. Blood Fury keeps the battle roar (55), the Roar roars (74).
clip = 82
take = 0
from = "OrcMale"
effects = [{ kind = "steadfast", secs = [3.0, 3.0], amount = 1.0, aura = 20572 }]

# Berserker Rage's EX: blood for fury. 15% of the health they have now (never the last point) for
# 8 sec of free attacks 25% harder: what Momentum gives at 5 stacks, at once, without having to
# keep it. Nothing heals it back: the price stays paid.
