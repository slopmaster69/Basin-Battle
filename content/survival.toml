# --- the Horde's camps ------------------------------------------------------------------------------
# Kill every fighter of a camp's packs (`camp` on a `[[pack]]`) and it's taken: none come back there
# for `hold` seconds, and the first time the camp pays `reward` into the chest.

[[camp]]
key = "mine"
name = "the Fargodeep mine yard"
title = "Mine Yard Taken"
hold = 600.0
reward = { tin = 3, bronze = 2, linen = 4 }

[[camp]]
key = "darkspear"
name = "the Darkspear camp"
title = "Darkspear Camp Taken"
hold = 600.0
reward = { leather = 3, silverleaf = 3, peacebloom = 3 }

# --- the settlement attack ------------------------------------------------------------------------

[raid]
# The first raid; once it's beaten the bell calls the next (`[[raid.tier]]`), and once the last is
# beaten it comes again with a raider more of each kind every time.
title = "Warsong Raid"
road = "the Goldshire road from the east"
# The camp must have these stations before the bell can be rung.
needs = ["cooking", "smithy"]
# Seconds of warning between ringing the bell and the first raider.
warning = 25.0
# Where they come from, and who.
# Up the Westfall road from the mine yard, then in through the gate.
from = [-9742.0, 520.0]
raiders = [ { mob = "grunt", count = 4 }, { mob = "shaman", count = 1 }, { mob = "overseer", count = 1 }, { mob = "captain", count = 1 } ]
# Raiders walk in this many at a time, this far apart.
wave_size = 2
wave_gap = 6.0
# If every hero is down this long, the raiders burn what they reached and leave.
rout_secs = 25.0
# What holding the camp is worth, into the storage chest.
reward = { ore = 6, wood = 6 }

[[raid.tier]]
title = "Darkspear Raid"
# The Darkspear come once the camp tans hides and brews salves: they want both.
needs = ["tanning", "cauldron"]
# Through the woods to the north-east, from their camp by the Goldshire road.
from = [-9575.0, 560.0]
road = "the woods to the north-east"
raiders = [ { mob = "berserker", count = 3 }, { mob = "spearman", count = 2 }, { mob = "witchdoctor", count = 2 }, { mob = "wolf", count = 2 }, { mob = "brave", count = 1 }, { mob = "shadowhunter", count = 1 } ]
reward = { leather = 4, linen = 6, peacebloom = 4, silverleaf = 3 }

[[raid.tier]]
title = "Horde Warband"
# The whole Horde camp comes up the road once the camp has a workbench and a palisade to break.
needs = ["workbench", "palisade"]
# Over the Westfall bridge, the warband's road in from the west.
from = [-9792.0, 812.0]
road = "the Westfall bridge to the west"
# Warlord Gorzak comes with the last of them.
raiders = [ { mob = "grunt", count = 4 }, { mob = "archer", count = 2 }, { mob = "shaman", count = 2 }, { mob = "overseer", count = 2 }, { mob = "deathguard", count = 2 }, { mob = "cutthroat", count = 1 }, { mob = "brave", count = 1 }, { mob = "warlord", count = 1 } ]
wave_size = 3
warning = 35.0
reward = { bronze = 4, tin = 4, ore = 8, stone = 6 }

[[raid.tier]]
title = "Blackrock Assault"
# The Blackrock come down the east road from Ridgepoint once the warband is broken and the camp
# keeps its archers on the wall: Rak'gash the Herald at their back.
needs = ["watchtower", "palisade"]
from = [-9690.0, 420.0]
road = "the Goldshire road from the east"
raiders = [ { mob = "blackrock_grunt", count = 5 }, { mob = "blackrock_caster", count = 2 }, { mob = "prowler", count = 3 }, { mob = "kobold_tunneler", count = 2 }, { mob = "rakgash", count = 1 } ]
wave_size = 3
warning = 35.0
reward = { bronze = 4, silver = 3, ore = 6 }

# --- the Proving Ring -----------------------------------------------------------------------------
# A page of the Smuggler's Logbook at camp, there from the start: a ring of braziers on the level
# field south of Fargodeep where the Horde comes at you in waves that never end, each worth more
# than the last (in the foes' `cost`) and tougher, a champion every `boss_every`th. Fall, leave by
# the banner or walk out of the ring and your run is over; nothing you carry is lost there. The
# camp's best wave is kept.

[arena]
name = "the Proving Ring"
page = "The Proving Ring"
at = [-9910.0, 98.0]
radius = 16.0
