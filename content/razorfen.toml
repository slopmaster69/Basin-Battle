# Razorfen Kraul: the quillboar's warren of thorns in the southern Barrens, where Charlga
# Razorflank speaks for Agamaggan. A dungeon of its own beside the Deadmines (read like
# deadmines.toml: its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 47 (RazorfenKraulInstance: x north, y west, z up), only the
# warren's part of it read. In at the thorn gate; down to Roogug's hollow; the east loop (Aggem
# Thorncurse, and Death Speaker Jargba at its far end); down into the warren's heart (the second
# lamp) and its pit (Overlord Ramtusk); Agathelos's pen; and up through the thorn tunnels to
# Charlga Razorflank. Out by the gate.

[dungeon]
key = "razorfen"
name = "Razorfen Kraul"
map = 47
map_dir = "RazorfenKraulInstance"
area = 491
window = [[1890.0, 1370.0], [2250.0, 2050.0]]
icon = "INV_Misc_Root_02"
blurb = "The quillboar's warren of thorns, where Charlga speaks for Agamaggan"
first_page = "The thorn gate at the top of the warren. Mind the spines."
welcome = "Razorfen Kraul. The quillboar dig their warren under Agamaggan's thorns, and Charlga Razorflank speaks for the dead demigod. Two lamps: one at the thorn gate, one in the warren's heart. Rest at a lamp to heal, fill your Draughts (T) and send the quillboar back to their burrows. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "thorn_fetish"
hero_health = 0.7
exit = [1943.0, 1544.6, 82.0]
exit_radius = 5.0
exit_boss = "charlga"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "razorfen_gate"
name = "The Thorn Gate"
at = [1943.0, 1544.6, 82.0]
facing = 0.8

[[dungeon.lamp]]
key = "razorfen_heart"
name = "The Warren's Heart"
at = [2107.5, 1792.2, 48.7]
facing = 1.2

# --- secrets -----------------------------------------------------------------------------------------

# A shrine to Agamaggan under the thorns at the warren's south-west, where Charlga takes her
# power. Whoever touches it, Agamaggan notices.
[[dungeon.door]]
key = "agamaggan_shrine"
name = "Agamaggan's Shrine"
kind = "hidden"
at = [2077.0, 2002.0, 63.2]
find = 4.0
reveals = ["shrine_cache", "charlga_vow"]
text = "under the thorns: a shrine of bones and tusks to Agamaggan, still warm with blood. Something vast, long dead, takes notice of you."

[[dungeon.box]]
key = "shrine_cache"
at = [2078.6, 1999.0, 63.0]
facing = 3.0
loot = { draught_flask = 1, thorn_fetish = 14 }

[[dungeon.note]]
key = "charlga_vow"
name = "A Thornweaver's Vow, Carved in Bone"
at = [2075.7, 2004.0, 63.3]
facing = 3.0
text = "Carved small, in quillboar script someone has glossed in Common: \"Charlga is Agamaggan's tongue. Should the tongue be cut out, and the shrine touched by an outsider's hand, the Great Boar will speak for himself.\""

# The far end of the east loop, past the Death Speaker: his cache.
[[dungeon.door]]
key = "jargba_cache"
name = "The Death Speaker's Cache"
kind = "hidden"
at = [2153.3, 1430.8, 74.4]
find = 4.0
reveals = ["bone_cache"]
text = "behind the Death Speaker's altar: what the dead were given to keep."

[[dungeon.box]]
key = "bone_cache"
at = [2152.0, 1428.0, 74.2]
facing = 0.0
loot = { thorn_fetish = 16, tonic = 1, whetstone = 1 }

# A side burrow off the tunnels west of the heart: an earthcaller who never came out.
[[dungeon.door]]
key = "halmgar_burrow"
name = "A Side Burrow"
kind = "hidden"
at = [2032.7, 1761.6, 60.6]
find = 4.0
reveals = ["halmgar"]
text = "a burrow off the tunnel, its floor scored with circles: an earthcaller looks up from his work."

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "tauren_warning"
name = "A Tauren Scout's Warning"
at = [1946.0, 1548.0, 82.0]
facing = 0.8
text = "\"Charlga Razorflank leads the quillboar here; she says she speaks for Agamaggan, who died on these thorns. Her people say she keeps his shrine somewhere deep in the south-west of the warren. Do not touch it.\""

[[dungeon.note]]
key = "scratched_hide"
name = "A Scratched Hide"
at = [2062.0, 1612.0, 62.8]
facing = 0.0
text = "A hide scratched with a map of tunnels. One side burrow, west of the warren's heart, is marked with circles and the word: HALMGAR."

