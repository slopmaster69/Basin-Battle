# The Scarlet Monastery's Library: the Crusade's books and the men who guard them, Houndmaster
# Loksey and Arcanist Doan. A dungeon of its own beside the Deadmines (read like deadmines.toml:
# its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 189 (MonasteryInstances: x north, y west, z up), only the
# Library wing's part of it read. In by the hall; through the halls to the Houndmaster's kennel
# corridor; the reading rooms (the second lamp); and the library's far chamber, where Doan keeps
# the books nobody else may read. Out by the hall.

[dungeon]
key = "library"
name = "Scarlet Monastery: Library"
map = 189
map_dir = "MonasteryInstances"
area = 796
window = [[90.0, -470.0], [310.0, -110.0]]
icon = "INV_Misc_Book_07"
blurb = "The Crusade's books, its hounds, and its Arcanist"
first_page = "The Library's hall. Somewhere ahead, dogs are barking."
welcome = "The Scarlet Monastery's Library. Houndmaster Loksey's dogs have your scent already, and Arcanist Doan guards the books nobody else may read. Two lamps: the hall, and the reading rooms. Rest at a lamp to heal, fill your Draughts (T) and send the Crusade back to its shelves. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
# How hard next to the others (1 to 3): the Library: among the hardest (29 to 39).
tier = 3
# The camp's first clear of it (every boss down in one run): into the chest. Scaled by tier
# (silver and bronze for a first dungeon, then pearl, then silk); tune freely.
first_clear = { silver = 4, pearl = 2, silk = 4 }
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "scarlet_insignia"
hero_health = 0.7
# Each hero past the first: this share more foes in every pack of two or more (not a boss's nor
# an elite's), the pack's health (`hero_health`) shared over them. (Play-test: four heroes met the
# same two foes as one did, each a sponge, all on one hero. About twice the foes for four.)
hero_foes = 0.35
exit = [245.7, -186.6, 18.7]
exit_radius = 5.0
exit_boss = "doan"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "library_hall"
name = "The Library's Hall"
at = [245.7, -186.6, 18.7]
facing = 3.9

[[dungeon.lamp]]
key = "library_reading"
name = "The Reading Rooms"
at = [257.9, -330.0, 18.5]
facing = 4.7

# --- secrets -----------------------------------------------------------------------------------------

# A shelf in the far chamber that isn't a shelf: the Forbidden Tome.
[[dungeon.door]]
key = "forbidden_tome"
display = 255
look = "A Book in Rusted Chains"
scale = 1.3
name = "The Forbidden Tome"
kind = "hidden"
at = [137.5, -426.5, 18.5]
find = 4.0
reveals = ["tome_cache", "doan_warning"]
text = "behind the last shelf in the far chamber: a book chained shut, and the chain has rusted through. You open it. Something on the page opens its eyes."
page = "Inside the cover is a Crusade catalogue slip, in the Arcanist's tidy hand.{n}{n}Taken from a necromancer's house in Andorhal. Chained and blessed by three priests. Not to be read. Not to be burned either: burning would only let it out. Kept shut, and kept here, where I can watch it. -- D.{n}{n}The first page is not writing at all but a drawing crowded into the margins: a shape all limbs and lettering, like a word that has grown arms. It was not looking at you when you turned the page. It is now. Under your fingers the ink is warm and moving very slightly, the way skin moves over breath.{n}{n}In the margin beside it, Doan has written something more."

[[dungeon.box]]
key = "tome_cache"
name = "Scarlet Coffer"
at = [138.5, -428.5, 18.5]
facing = 1.5
loot = { draught_flask = 1, scarlet_insignia = 14 }

[[dungeon.note]]
key = "doan_warning"
display = 220
scale = 1.3
name = "Doan's Note in the Margin"
at = [136.5, -424.5, 18.5]
facing = 1.5
text = "\"The Tome binds what it holds only while it is shut and I live. Should a stranger open it and I fall, the thing on its pages will step off them.\""

# The kennel's back: Loksey's private store.
[[dungeon.door]]
key = "kennel_store"
display = 696
look = "Sacks of Hound Feed"
name = "The Kennel's Back Room"
kind = "hidden"
at = [185.6, -270.6, 18.6]
find = 4.0
reveals = ["kennel_box"]
text = "behind the kennels, a store room: the Houndmaster's own, and a good deal of the Crusade's silver."
page = "The store room smells of wet dog and lamp-oil. On a peg by the door hangs the Houndmaster's feed book, every page signed at the foot with a big L and paid from the Crusade's purse.{n}{n}Feed for forty hounds, one month: twenty gold. Collars, forty: four gold. Physic for hounds hurt in the Light's service: six gold.{n}{n}The kennel holds twelve dogs. You counted them on your way in, and they counted you.{n}{n}On the last page is the sum of it all, and beneath, in the same big hand: The Arcanist reads his books and the Commander reads his scripture, and nobody reads mine. When the dead come over the wall I'll be gone with the dogs and the silver, and they can pray at the gate."

[[dungeon.box]]
key = "kennel_box"
name = "Scarlet Coffer"
at = [185.0, -273.0, 18.6]
facing = 0.0
loot = { scarlet_insignia = 16, tonic = 1, whetstone = 1 }

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "library_rules"
hints = ["forbidden_tome", "kennel_store"]
clue = "No one goes near the last shelf of the far chamber; the Houndmaster keeps a store room behind the kennels."
display = 220
scale = 1.3
name = "The Library's Rules"
at = [233.4, -162.5, 18.7]
facing = 3.9
text = "\"No novice past the reading rooms. No one at all near the last shelf of the far chamber, by order of the Arcanist. The dogs are not to be fed by hand, and the store room behind the kennels is the Houndmaster's own: keep out of it.\""

