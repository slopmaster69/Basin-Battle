# --- the Restricted Section: the west wing nobody's sent to ---------------------------------------
# A whole room off every way through, where the Crusade shelved what it feared; its Archivist
# still keeps it, and two wardens wait by his strongbox for anyone who'd open it.
[[dungeon.door]]
key = "restricted_section"
display = 107
look = "A Stack of Overdue Books"
scale = 1.3
name = "The Restricted Section"
kind = "hidden"
at = [127.0, -257.0, 18.6]
find = 6.0
reveals = ["archivist", "restricted_cache"]
text = "the west wing, past a rope across the door: the Restricted Section. Someone is still reading in here."
page = "A card hangs from the rope: CLOSED TO ALL BUT THE ARCHIVIST. Past it, the shelves hold what the Crusade burned everywhere else: necromancers' notes, demon names, histories of Lordaeron the Crusade would rather were told another way. On a high desk lies the register, kept in a small, exact hand.{n}{n}Brother Aldric. Borrowed: On the Binding of the Dead. Returned three days late. Not forgiven.{n}{n}Sister Merin. Borrowed: The Burning of Darrowshire. Not returned. Sister Merin has been reminded.{n}{n}Interrogator Vishas. Borrowed: A Treatise on Pain. Returned with notes in the margins. Not forgiven.{n}{n}The next line is blank, the ink in the pen beside it still wet. Somewhere among the shelves a page turns, and a dry voice clears its throat."

