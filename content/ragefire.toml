# Ragefire Chasm: the caves of fire under Orgrimmar, where the Searing Blade hides and the troggs
# dig. A dungeon of its own beside the Deadmines (read like deadmines.toml: its lists join the
# rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 389 (OrgrimmarInstance, a WMO-only map: x north, y west, z
# up). In at the top of the chasm; down the trogg tunnels to the deep chamber (Bazzalan) and the
# lava pit (Jergosh at his ritual); up to the Searing Blade's camp (the second lamp); west through
# the burning caves to the far ledge, where Taragaman the Hungerer feeds. Out the way you came.

[dungeon]
key = "ragefire"
name = "Ragefire Chasm"
map = 389
map_dir = "OrgrimmarInstance"
area = 2437
icon = "Spell_Fire_Incinerate"
blurb = "The caves of fire under Orgrimmar, and the cult that hides in them"
first_page = "The top of the chasm, where the troggs' tunnels start down into the fire."
welcome = "Ragefire Chasm. The Searing Blade hides down here, and something older feeds at the bottom of it. Two lamps: one at the top of the chasm, one in the cult's own camp. Rest at a lamp to heal, fill your Draughts (T) and send the cave's dwellers back where they were. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
# How hard next to the others (1 to 3): Ragefire Chasm: the shallowest of them (levels 13 to 18 in the old game).
tier = 1
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "searing_token"
hero_health = 0.7
exit = [6.2, -17.6, -18.3]
exit_radius = 5.0
exit_boss = "taragaman"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

# --- lamps: only two ---------------------------------------------------------------------------------

[[dungeon.lamp]]
key = "ragefire_top"
name = "The Top of the Chasm"
at = [6.2, -17.6, -18.3]
facing = 3.6

[[dungeon.lamp]]
key = "ragefire_camp"
name = "The Searing Blade's Camp"
at = [-114.0, 18.3, -18.7]
facing = 1.3

# --- secrets -----------------------------------------------------------------------------------------

# The deep chamber's far corner, up a slope nobody climbs: Jergosh's grimoire, hidden from his own.
[[dungeon.door]]
key = "jergosh_grimoire"
display = 184
look = "A Black Book, Warm to the Touch"
scale = 1.4
name = "The Invoker's Grimoire"
kind = "hidden"
at = [-306.0, -6.3, -52.5]
find = 4.5
reveals = ["grimoire_cache", "grimoire_page"]
text = "up the slope in the deep chamber's corner: Jergosh's grimoire, its binding-ward still warm. Whatever it keeps bound, it isn't now."
page = "The book is bound in something that was once skin, and it is warm through your gloves, like a hearthstone an hour after the fire. The flyleaf is in the Invoker's own hand.{n}{n}This is the binding of the Heart of Ragefire, and it is mine. Not the Searing Blade's. Not Bazzalan's, who asks to read it and will not. The Heart answers me while this book holds it, and I do not mean to be eaten by my own fire.{n}{n}The pages after are columns of words in the demon tongue, each with a mark in red where the reader must draw breath. Near the back one page has been torn out, its edge still curling, as if it had come away from a flame.{n}{n}Far beneath the chasm, something shifts its weight."

[[dungeon.box]]
key = "grimoire_cache"
name = "Searing Blade Coffer"
at = [-306.0, -8.0, -52.5]
facing = 1.5
loot = { draught_flask = 1, searing_token = 14 }

[[dungeon.note]]
key = "grimoire_page"
display = 220
scale = 1.3
name = "A Torn Page, Still Warm"
at = [-305.0, -4.5, -52.5]
facing = 1.5
text = "\"...the Heart of Ragefire answers the Invoker while the grimoire holds it. Should the book be taken from its place and the Invoker die, nothing will hold the Heart at all.\""

# A ledge above the cult's camp, reached by the rocks at its back.
[[dungeon.door]]
key = "camp_ledge"
display = 457
look = "A Barrel Wedged on the Ledge"
name = "A Ledge Above the Camp"
kind = "hidden"
at = [-77.4, 90.4, -7.3]
find = 4.0
reveals = ["ledge_cache"]
text = "up on the ledge over the camp: the cult's tithes, hidden from its own collectors."
page = "The barrel is wedged so tight into the rock that it must have been carried up empty and filled a handful at a time. Inside, under the red stones, is a strip of hide marked in Orcish with a collector's careful tallies.{n}{n}Tithes, the Cleft, this moon. From the trogg-hunters: forty. From the new blood down from Orgrimmar: sixty. To the Invoker: eighty. To the ledge: twenty.{n}{n}Underneath, in the same hand: The Invoker counts the tithes twice and never counts his own people at all. When the Kor'kron come down, and they will, the ones with stones of their own walk out the back way. The rest burn with him.{n}{n}Every moon is the same. Eighty to the Invoker. Twenty to the ledge."

[[dungeon.box]]
key = "ledge_cache"
name = "Searing Blade Coffer"
at = [-78.5, 91.5, -7.3]
facing = 3.0
loot = { searing_token = 16, tonic = 1 }

# The west cave's high ledge: a tauren who came for the cult, and stayed.
[[dungeon.door]]
key = "maur_ledge"
display = 4718
look = "A Grimtotem Totem"
scale = 0.8
name = "Maur's Ledge"
kind = "hidden"
at = [-341.9, 257.6, -8.1]
find = 4.0
reveals = ["maur"]
text = "on the west cave's high ledge: a tauren in Grimtotem paint, who turns from the fire to look at you."
page = "A small fire burns on the ledge, fed with nothing you can see. Beside it stands a Grimtotem totem, and wound round its post is a strip of hide marked in Taur-ahe, with the same words below in big, careful Orcish, as if the writer wanted someone to understand.{n}{n}First sun: the burning ones are in the Cleft. I follow them down. Second: I kill two. They do not scream; they laugh. Fifth: the fire under the chasm says my name. Not my name. My mother's. Eighth: I do not hunt them now. I keep the fire. The fire keeps me.{n}{n}The last mark is only a handprint, pressed into the hide in ash.{n}{n}By the fire, a tauren in Grimtotem paint has not moved since you climbed up. Now he does."

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "korkron_report"
hints = ["jergosh_grimoire"]
clue = "The Invoker hid his grimoire in the deep chamber, up the slope in its corner."
display = 183
scale = 1.3
name = "A Kor'kron Report"
at = [-5.9, -42.0, -21.7]
facing = 3.6
text = "\"The Searing Blade are in the chasm, under the Cleft. Their Invoker keeps a grimoire. Our scout saw him carry it down to the deep chamber and come back without it. He hid it from his own.\""

[[dungeon.note]]
key = "ritual_notes"
hints = ["camp_ledge"]
clue = "Someone hides the cult's tithes on the ledge over the camp."
display = 190
scale = 1.3
name = "Jergosh's Ritual Notes"
at = [-101.8, 42.0, -17.8]
facing = 1.0
text = "\"The pit is ready. The Heart stirs under the lava when I call it, and the grimoire keeps it from turning on me. Nobody touches the grimoire. NOBODY. And the tithes come up short again: the collectors swear the ledge over the camp is bare. I say look again.\""

[[dungeon.note]]
key = "grimtotem_feather"
hints = ["maur_ledge"]
clue = "A Grimtotem arrow scratched in the rock, pointing up the west cave's high ledge."
display = 163
scale = 1.0
name = "A Grimtotem Feather"
at = [-305.6, 246.2, -12.5]
facing = 0.5
text = "A painted feather, Grimtotem colours, tucked in a crack in the rock. Above it, scratched with a knife: an arrow, pointing up, at the ledge above."

