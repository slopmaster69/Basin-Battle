at = [1172.0, 829.2, -102.6]
facing = 2.30

[[siege.base]]
key = "lumber_mill"
name = "the Lumber Mill"
at = [813.1, 1183.6, 11.9]
facing = 5.57

# The ways to play: which camps, and how many heroes share each.
[[siege.mode]]
key = "1v1"
name = "One against one"
text = "The Stables against the Farm, across the basin."
bases = ["stables", "farm"]
per_base = 1

[[siege.mode]]
key = "2v2"
name = "Two against two"
text = "Two heroes to a camp, the Stables against the Farm: one Hearth, two purses."
