# Siege: a page of the Smuggler's Logbook that takes heroes to Arathi Basin, where each side holds
# a camp round its Hearth against waves of creatures, the base wave everyone faces and whatever
# the other side bought to send. Every creature sent raises the sender's income for the rest of
# the match, so attacking is also an investment. A match is one against one, two against two
# (two heroes sharing a camp), three or four each for themselves; the last Hearth standing wins,
# or the healthiest after the last wave. Everyone starts each match the same: their class's Q
# and E, the plain kit; the match's gold buys defences, sends and the board's other cards. What
# a hero carries at camp stays at camp.
#
# Read beside survival.toml (its lists join the camp's: the Hearth is a station only Siege
# builds).

[siege]
name = "the Siege of Arathi Basin"
page = "The Siege of Arathi Basin"
text = "Hold a camp in Arathi Basin against the waves your rivals buy for you, and buy theirs: every creature you send raises your income for the rest of the match."
# Where heroes wait for a match (Trollbane Hall's yard, looking down into the basin), and the
# Blacksmith between the camps (the contested middle: its veins pay gold).
lobby = [1294.4, 1308.9, -10.8]
lobby_facing = 3.95
middle = [995.7, 1025.9, -43.7]
# Seconds from a match filling to its start (each hero is told which camp they'll hold); before
# the first wave; each wave (the next comes on time, the last one beaten or not, unless everyone
# is ready sooner: F at your Hearth, and it comes `ready_secs` after the last one is); the warning
# of what's been bought for you; after the end, before everyone is back in the hall.
countdown = 15.0
first_gap = 45.0
wave_secs = 55.0
warn_secs = 10.0
over_secs = 20.0
ready_secs = 5.0
# Waves in a match: after the last one's time is up, the healthiest Hearth wins.
waves = 20
# Gold: what a hero starts with, their income paid at every wave's start (each send adds its
# own), a foe's own `health` times this for felling it, the share of a hero's gold taken by the
# rival who fells them.
start_gold = 100
start_income = 20
kill_gold = 0.08
steal = 0.15
# A camp's building ground round its Hearth, and how far out along the way to the middle its gate
# is (where the waves come in).
build_radius = 40.0
gate_walk = 70.0
# Down in a match: back up at your Hearth this long after.
respawn_secs = 8.0
# The camps' heart (a station of its own, below).
hearth = "hearth"
# What a defence costs in a match, in gold (mending a wrecked one: half).
build = { palisade = 15, barricade = 20, watchtower = 60 }
# A card from the board (N), by its row, in gold.
cards = { ranged = 80, close = 80, utility = 60, defense = 70, ultimate = 150 }
# The base wave every camp faces: what the first is worth (in foes' `cost`), how much more each
# after, the share more for each hero past the first in the camp, the most at once, and the
# share more health each wave past the first. A wave not beaten is still there when the next
# comes, so they're kept small: two or three to begin with, five or six at the end.
budget = 1.4
growth = 0.35
per_hero = 0.6
most = 6
toughen = 0.04
# A match's foes against heroes who start with two cards: this share of their usual health (the
# camp's are 1.6 times their entry's) and of their blows' damage.
foe_health = 0.6
foe_damage = 0.7
# The most creatures a hero can send for one wave: 4 for the first, one more each wave after
# (8 by the fifth, 23 by the twentieth).
send_cap = 4
send_cap_growth = 1
# The gold a gather at one of the contested middle's veins pays (`[[siege.node]]` below).
vein_gold = 12
# Every wave's start, each hero still standing is given these (the only food and salves in a
# match), up to `supply_most` of each in the bags.
supply = { roast = 1, salve = 1 }
supply_most = 3

# The camps, round the basin: the Stables (north-east), the Farm (south-west), the Gold Mine
# (south-east, down in its pit) and the Lumber Mill (north-west, up on its bluff). `facing` looks
# toward the middle.
[[siege.base]]
key = "stables"
name = "the Stables"
at = [1177.7, 1183.4, -56.2]
facing = 3.85

[[siege.base]]
key = "farm"
name = "the Farm"
at = [824.0, 826.5, -57.7]
facing = 0.86

[[siege.base]]
key = "gold_mine"
