# Basin Battle cards: what players pick between waves and from relic caches.
#
# Each card shows on the buff bar with the icon of `spell` (or `aura`, a spell with the same icon that
# doesn't paint an effect on your character); its rank is the stack count. Picking a
# card you already hold ranks it up (max 5). Abilities, modifiers and triggers gain half their
# rank-1 strength per rank; stats gain their full amount per rank.
#
# Damage numbers are multiples of your "hit": your weapon's damage per second times 2, so they
# grow with level and gear and don't depend on attack speed.
#
# rarity: common, uncommon, rare, epic, legendary. classes: which class the spell comes from; anyone
# can draw any card, so cross-class builds are the point. Offers lean towards cards that share
# tags with what you already hold.
# school: 0 physical, 1 holy, 2 fire, 3 nature, 4 frost, 5 shadow, 6 arcane.

