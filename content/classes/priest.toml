# The Priest: Light and Shadow. Heals and shields that keep the team (and the Ancient's
# defenders) standing; holy fire and shadow that wear the Scourge down. No mana: cooldowns.
#
# How the Priest levels up (talent_style = "class", as the Warrior and the Mage):
#   - Every spell is a card; you hold up to 6. Each has its own deck of about 15 upgrades and
#     takes 10 in a run; the last of each deck is an Epic, offered once 5 of its upgrades are taken.
#   - Every spell has one job:
#       Smite atonement (its damage mends) · Shadow Word: Pain the spreader · Mind Blast the burst ·
#       Holy Nova the panic button · Power Word: Shield the barrier · Renew the slow heal ·
#       Flash Heal the emergency · Holy Fire the burn · Mind Flay the snare ·
#       Psychic Scream the scatter · Prayer of Healing the group heal · Devouring Plague the drain.
#   - A Specialization (Holy, Discipline or Shadow) turns up at random as a Legendary card, one a
#     run: it opens its two spells (Lightwell and Greater Heal; Power Infusion and Inner Focus;
#     Silence, the Priest's interrupt, and Vampiric Embrace) and its own path cards.
# See warrior.toml for how upgrades, triggers and lit keys are written.

talent_style = "class"
path_label = "Specialization"

[upgrades]
per_spell = 10
power = 0.03
cost = 0.0

[[tree]]
key = "discipline"
name = "Discipline"
text = "Shields and empowerment: Power Word: Shield, Power Infusion, Inner Focus."
icon = 1243
background = "PriestDiscipline"

[[tree]]
key = "holy"
name = "Holy"
text = "The Light: Smite, Holy Fire, Holy Nova and heals, Lightwell."
icon = 2061
background = "PriestHoly"

[[tree]]
key = "shadow"
name = "Shadow"
text = "Torment: Shadow Word: Pain, Mind Blast, Mind Flay, Silence, Vampiric Embrace."
icon = 589
background = "PriestShadow"

