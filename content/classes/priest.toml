# The Priest: Light and Shadow. Heals and shields that keep the team (and the Ancient's
# defenders) standing, holy fire and shadow that wear the Scourge down.
#   Discipline - shields and empowerment: Power Word: Shield, Inner Focus, Power Infusion.
#   Holy       - the Light: Smite, Holy Fire, Holy Nova, heals, Spirit of Redemption, Lightwell.
#   Shadow     - torment: Shadow Word: Pain, Mind Blast, Shadow Weaving, Vampiric Embrace,
#                Shadowform (no holy spells while in it).
# The core spells feed each other: Mind Blast hits targets in Shadow Word: Pain harder, and
# Smite hits targets burning with Holy Fire harder.
# See mage.toml for how this file works.

[[tree]]
key = "discipline"
name = "Discipline"
text = "Shields and empowerment: Power Word: Shield, Inner Focus, Power Infusion."
icon = 1243
background = "PriestDiscipline"

[[tree]]
key = "holy"
name = "Holy"
text = "The Light: Smite, Holy Fire, Holy Nova and heals, Lightwell."
icon = 2061
background = "PriestHoly"

[[tree]]
key = "shadow"
name = "Shadow"
text = "Torment: Shadow Word: Pain, Mind Blast, Vampiric Embrace, Shadowform."
icon = 589
background = "PriestShadow"

