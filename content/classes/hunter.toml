# The Hunter: a marksman with a beast at their side. Your wolf fights your target (or the nearest
# enemy), comes back after a short rest if it falls, and grows with Beast Mastery.
#   Beast Mastery - the pet: Claw, Mend Pet, Furious Howl, Intimidation, Bestial Wrath.
#   Marksmanship  - shots: Arcane Shot, Aimed Shot, Multi-Shot, Hunter's Mark, Trueshot Aura.
#   Survival      - traps and toughness: Serpent Sting, Freezing and Explosive Traps, Wyvern Sting.
# The core spells feed each other: Arcane Shot hits poisoned enemies (Serpent Sting) harder,
# and Hunter's Mark makes your target take more from you and your pet.
# See mage.toml for how this file works.

[[tree]]
key = "beast_mastery"
name = "Beast Mastery"
text = "Your pet: Claw, Mend Pet, Intimidation, Bestial Wrath."
icon = 1515
background = "HunterBeastMastery"

[[tree]]
key = "marksmanship"
name = "Marksmanship"
text = "Shots: Aimed Shot, Multi-Shot, Hunter's Mark, Trueshot Aura."
icon = 19434
background = "HunterMarksmanship"

[[tree]]
key = "survival"
name = "Survival"
text = "Traps and toughness: Serpent Sting, Freezing Trap, Wyvern Sting."
icon = 1499
background = "HunterSurvival"

