# The Hunter: a marksman with a beast at their side. Your wolf fights your target (or the nearest
# enemy) and comes back after a short rest if it falls. No mana: cooldowns.
#
# How the Hunter levels up (talent_style = "class", as the other classes):
#   - Every spell is a card; you hold up to 6. Each has its own deck of about 15 upgrades and
#     takes 10 in a run; the last of each deck is an Epic, offered once 5 of its upgrades are taken.
#   - Every spell has one job:
#       Arcane Shot the shot on the run · Serpent Sting the poison · Claw the pet's strike ·
#       Multi-Shot the spread · Concussive Shot the slow · Hunter's Mark the team's call ·
#       Volley the rain · Explosive Trap the ambush · Freezing Trap the lockdown ·
#       Furious Howl the rally · Feign Death the escape · Scatter Shot the peel.
#   - A Specialization (Beast Mastery, Marksmanship or Survival) turns up at random as a Legendary
#     card, one a run: it opens its two spells (Bestial Wrath and Intimidation; Aimed Shot and
#     Rapid Fire; Wyvern Sting and Deterrence) and its own path cards.
# See warrior.toml for how upgrades, triggers and lit keys are written.

talent_style = "class"
path_label = "Specialization"

[upgrades]
per_spell = 10
power = 0.06
cost = 0.0
[[tree]]
key = "beast_mastery"
name = "Beast Mastery"
text = "Your pet: Claw, Mend Pet, Intimidation, Bestial Wrath."
icon = 1515
background = "HunterBeastMastery"

[[tree]]
key = "marksmanship"
name = "Marksmanship"
text = "Shots: Aimed Shot, Multi-Shot, Hunter's Mark, Trueshot Aura."
icon = 19434
background = "HunterMarksmanship"

[[tree]]
key = "survival"
name = "Survival"
text = "Traps and toughness: Serpent Sting, Freezing Trap, Wyvern Sting."
icon = 1499
background = "HunterSurvival"

