# The Mage: a glass cannon who controls the field. Three ways to play, as in the old trees:
#   Arcane - speed and spell-chaining: Clearcasting, Presence of Mind, Arcane Power.
#   Fire   - crits that set everything burning: Scorch's vulnerability, Ignite, Pyroblast, Combustion.
#   Frost  - slow, freeze, shatter: Chill and Frozen enemies, crits against the frozen, Ice Barrier.
# The schools meet: Fire Blast is stronger against Frozen enemies, and Arcane Explosion fills the
# gaps of a Frost Nova.
#
# How this file works (see crates/htl-sim/src/kit.rs for every number a spell can have):
# - A [[spell]] is a card. `core` spells can be a run's first pick. Damage is a multiple of your
#   "hit" (weapon damage per second x 2); `dot` is a total over `dot_secs`.
# - Each [[spell.perk]] is an upgrade card for a spell you hold: up to 4 per spell. Every perk also
#   adds 10% to the spell's power.
# - [[talent]]s cost a point each rank (a point every level from 2). Tier n opens after 3*(n-1)
#   points in that tree. `values` are per rank: "{0%}" in the text is values[0] x rank.

[[tree]]
key = "arcane"
name = "Arcane"
text = "Speed and spell-chaining: Clearcasting, Presence of Mind, Arcane Power."
icon = 1449
background = "MageArcane"

[[tree]]
key = "fire"
name = "Fire"
text = "Crits that set everything burning: Ignite, Scorch, Pyroblast, Combustion."
icon = 133
background = "MageFire"

[[tree]]
key = "frost"
name = "Frost"
text = "Slow, freeze and shatter: crits against Frozen enemies, Ice Barrier."
icon = 116
background = "MageFrost"

