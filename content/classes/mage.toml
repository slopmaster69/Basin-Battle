# The Mage: a glass cannon who controls the field. No mana: every spell is a cooldown.
#
# How the Mage levels up (talent_style = "class", as the Warrior):
#   - Every spell is a card; you hold up to 6 on your bar. Each spell has its own deck of about
#     15 upgrades and takes 10 of them in a run; the last of each deck is an Epic, offered once
#     5 of its upgrades are taken.
#   - Every spell has one job:
#       Frostbolt the chill · Fireball the big hit · Arcane Missiles the elite melter ·
#       Arcane Explosion the panic button · Frost Nova the freeze (your escape) ·
#       Fire Blast the instant shatter · Scorch Fire Vulnerability · Blizzard holds a lane ·
#       Flamestrike the clump killer · Cone of Cold the peel · Blink the way out ·
#       Counterspell the interrupt.
#   - A Specialization (Fire, Frost or Arcane) turns up at random as a Legendary card, one a
#     run: it opens its two spells to the spell cards (Pyroblast and Combustion, Ice Barrier and
#     Cold Snap, Arcane Power and Presence of Mind; on keys of their own) and its own path cards.
#   - Class talents come whatever you hold; combinations only while you hold both spells.
#   - Rarity: Common numbers, Uncommon changes how you play, Rare lights a key / resets / casts,
#     Epic the capstones, Legendary the specializations.
# See warrior.toml for how upgrades, triggers and lit keys are written.

talent_style = "class"
path_label = "Specialization"

[upgrades]
per_spell = 10
power = 0.03
cost = 0.0

[[tree]]
key = "arcane"
name = "Arcane"
text = "Speed and spell-chaining: Arcane Missiles, Arcane Explosion, Blink, Counterspell."
icon = 1449
background = "MageArcane"

[[tree]]
key = "fire"
name = "Fire"
text = "Crits that set everything burning: Fireball, Fire Blast, Scorch, Flamestrike."
icon = 133
background = "MageFire"

[[tree]]
key = "frost"
name = "Frost"
text = "Slow, freeze and shatter: Frostbolt, Frost Nova, Blizzard, Cone of Cold."
icon = 116
background = "MageFrost"

