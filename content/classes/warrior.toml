# The Warrior: Rage. Your swings and the blows you take fill it (up to 100); every ability
# spends it. Between fights it fades.
#   Arms       - bleeds and big hits: Rend, Deep Wounds, Mortal Strike, Sweeping Strikes.
#   Fury       - rage and crits: Enrage, Flurry, Execute, Death Wish, Bloodthirst.
#   Protection - hold the line: blocks, Thunder Clap, Sunder Armor, Defiance pulls enemies off the
#                Ancient, Last Stand, Shield Slam, Shield Wall.
# The core spells feed each other: Heroic Strike hits bleeding enemies harder (Rend), and every
# Sunder Armor stack makes all your physical damage hit harder.
# See mage.toml for how this file works.

[[tree]]
key = "arms"
name = "Arms"
text = "Bleeds and big hits: Rend, Deep Wounds, Mortal Strike."
icon = 12294
background = "WarriorArms"

[[tree]]
key = "fury"
name = "Fury"
text = "Rage and crits: Enrage, Flurry, Execute, Death Wish, Bloodthirst."
icon = 1680
background = "WarriorFury"

[[tree]]
key = "protection"
name = "Protection"
text = "Hold the line: blocks, Thunder Clap, Defiance pulls enemies to you, Shield Slam."
icon = 71
background = "WarriorProtection"

