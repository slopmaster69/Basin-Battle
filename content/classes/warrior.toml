# The Warrior: Rage. Your swings and the blows you take fill it (up to 100); every ability
# spends it. Between fights it fades.
#
# How the Warrior levels up (talent_style = "class"):
#   - Every one of the 18 skills is a card. You hold up to 6 on your bar.
#   - Each skill has its own deck of ~20 upgrades. A skill can take 10 of them in a run, so no
#     run sees them all: two runs with the same skills still play differently.
#       repeat = n   a rank-up card that can be taken n times (each time it applies again)
#       fork = "x"   a choice: only one upgrade of that skill with the same fork can be taken
#       after = "k"  a follow-up: offered only once upgrade k of the same skill is taken
#       trigger      "when this happens, do that" (see kit.rs TriggerDef)
#   - Every card should be FELT the moment it's taken: a new thing on screen (an extra target,
#     a shockwave, a stun, a key that lights up), a rhythm you notice (a cooldown that halves,
#     a cost that goes to nothing), or a number big enough to see (25% a rank, not 5%).
#     Procs that light up a key (buff next = ...) make the next cast free, stronger or usable
#     anywhere; the big moments are called out on screen with the card's name.
#   - Class Talents are offered whatever skills you hold (rage, procs, defences, waves); a few
#     name one skill (requires = [one]) and come only while you hold it.
#   - Combinations are offered only when you hold BOTH skills they link: passive bonuses that
#     make the two play off each other.
#   - Weapon Paths re-arm you (greatsword, sword and shield, two weapons): one a run.
# The three [[tree]] entries only group the skills (and pick the talent-frame art).
# See mage.toml for how spell numbers work.

talent_style = "class"

[upgrades]
per_spell = 10
power = 0.06
cost = 0.07

[[tree]]
key = "arms"
name = "Arms"
text = "Bleeds and big hits: Rend, Mortal Strike, Sweeping Strikes."
icon = 12294
background = "WarriorArms"

[[tree]]
key = "fury"
name = "Fury"
text = "Rage and crits: Whirlwind, Execute, Bloodthirst, Death Wish."
icon = 1680
background = "WarriorFury"

[[tree]]
key = "protection"
name = "Protection"
text = "Hold the line: Thunder Clap, Sunder Armor, Revenge, Shield Slam, Shield Wall."
icon = 71
background = "WarriorProtection"

