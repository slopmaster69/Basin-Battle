# The Stockade: Stormwind's prison, taken by its inmates. A dungeon of its own beside the Deadmines
# (read beside survival.toml like deadmines.toml: its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 34 (StormwindJail, a WMO-only map: x north, y west, z up). In
# from the canals by the gate at the foot of the stairs; up the long corridor between the cell
# blocks to the crossing; the guard room north of it (Kam Deepfury, and the second lamp); the long
# hall west to the west hub (Targorr) and its wings; and east, once Targorr is down, to the east
# hub, where Bazil Thredd runs the riot. Out by the gate you came in.

[dungeon]
key = "stockade"
name = "The Stockade"
map = 34
map_dir = "StormwindJail"
area = 717
icon = "INV_Misc_Key_04"
blurb = "Stormwind's prison, in the hands of its inmates"
first_page = "The Stockade's gate, at the foot of the stairs from the canals. The riot is on the other side."
welcome = "The Stockade. The inmates hold it now, Bazil Thredd at their head. Two lamps in the whole place: one at the gate, one in the guard room past Kam Deepfury. Rest at a lamp to heal, fill your Draughts (T) and send the inmates back to their cells. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
# How hard next to the others (1 to 3): the Stockade: the middle (22 to 30).
tier = 2
# The camp's first clear of it (every boss down in one run): into the chest. Scaled by tier
# (silver and bronze for a first dungeon, then pearl, then silk); tune freely.
first_clear = { silver = 3, bronze = 4, pearl = 1 }
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "plunder"
hero_health = 0.7
exit = [57.0, 0.3, -18.2]
exit_radius = 5.0
exit_boss = "bazil"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

