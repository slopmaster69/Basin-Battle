# --- secrets -----------------------------------------------------------------------------------------

# A cell off the west hall, bricked up: the bricks only stacked dry across its mouth.
[[dungeon.door]]
key = "bricked_cell"
name = "Cell Four's Stash"
look = "A Bricked-Up Cell"
kind = "illusory"
display = 134
at = [137.0, 61.5, -34.9]
facing = 0.0
scale = 1.6
bars = [[138.5, 70.0], [138.5, 53.5]]
reveals = ["stash"]
text = "the bricks across the cell are only stacked dry: they tumble, and inside is someone's stash."
page = "The dry bricks lie in a heap. Behind them, in a sack under the cot, is the sort of stock no prisoner should have, and on the inside of the cell wall someone has kept accounts in chalk, where no inspector would think to look.{n}{n}Sold to the east block, for the warden: three files, eight silver each. Two bottles of tonic, in a laundry basket. One whetstone, to a big lad called Hamhock, who did not say what for.{n}{n}Balance to the warden, less my share: forty silver.{n}{n}At the bottom, in a hurried hand: He's having the cell bricked up with me out of it. Says it's for safe keeping. If I'm not back for this by the bells, I'm not coming back."

[[dungeon.box]]
key = "stash"
name = "Guard's Lockbox"
at = [160.0, 61.0, -34.9]
facing = 3.14
loot = { plunder = 14, tonic = 1, whetstone = 1 }

# The far end of the west hub's long wing: the warden's ledger, hidden where he kept his bribes.
[[dungeon.door]]
key = "warden_ledger"
display = 9
look = "A Broken Barrel on a Loose Flagstone"
name = "The Warden's Hiding Place"
kind = "hidden"
at = [175.0, 145.0, -33.9]
find = 4.0
reveals = ["bribes", "warden_ledger_note"]
text = "at the far end of the wing, under a loose flagstone: the warden's ledger, and his bribes."
page = "The flagstone lifts on a hollow lined with straw. In it lie a fat purse, a ledger bound in good leather, and a scrap of paper folded very small, as if it had been passed through bars.{n}{n}Warden -- two hundred, as agreed, for the keys to the east block. Leave them on the hook outside the guard room the night the bells ring. Thredd is not to know where they came from; let him think he's clever. The rest when it's done and the right men are out.{n}{n}Burn this. The Brotherhood remembers its friends. It remembers the others too.{n}{n}The paper was not burned. Across the top, in the warden's hand, is written: For when they turn on me."

[[dungeon.box]]
key = "bribes"
name = "Guard's Lockbox"
at = [176.0, 144.0, -33.9]
facing = 2.4
loot = { draught_flask = 1, plunder = 16 }

[[dungeon.note]]
key = "warden_ledger_note"
display = 387
scale = 1.4
name = "The Warden's Ledger"
at = [173.5, 143.0, -33.9]
facing = 2.4
text = "\"From E. V., for the keys to the east block: 200 gold. For looking the other way the night of the riot: 500. Thredd thinks it's his riot. It's mine. When it's over, I'll be the one who put it down.\" -- Warden Thelwater"

# The end of the east hub's south wing: a cell nobody opens.
[[dungeon.door]]
key = "bruegal_cell"
display = 181
look = "A Chain on an Unlocked Cell"
scale = 1.2
name = "Bruegal's Cell"
kind = "hidden"
at = [66.0, -92.0, -33.9]
find = 4.0
reveals = ["bruegal"]
text = "the last cell of the south wing: its door was never locked. The dwarf inside didn't want to leave. Until now."
page = "It is the tidiest cell in the Stockade: a swept floor, a folded blanket, twelve years of tally marks in neat rows of seven. On a shelf of loose brick sits a stack of letters, all addressed to Ironforge, none of them sent. The top one is new.{n}{n}Dear Brother, the door's still not locked. It hasn't been since the second year, when the turnkey lost the key and nobody looked for it. I could walk out to the gryphons any day I liked. I don't. Out there, someone would ask what I did in Thelsamar, and in here nobody asks.{n}{n}There's a riot on. Bells, shouting, men running past my door. Somebody's bound to try it, thinking it's locked. Then we'll see about leaving. -- B.{n}{n}On the cot, a very large dwarf opens his eyes."

# --- notes -------------------------------------------------------------------------------------------

[[dungeon.note]]
key = "guard_report"
hints = ["warden_ledger"]
clue = "The warden was prising at the floor at the far end of the wing, past the bricked-up cell."
display = 183
scale = 1.3
name = "A Guard's Report"
at = [59.9, 3.7, -20.5]
facing = 0.0
text = "\"The east block went first; Thredd had keys. We held the guard room until Deepfury broke out of solitary. The warden was nowhere. Nowhere. Somebody ought to ask where he was. His orderly says on his knees at the far end of the wing, past the bricked-up cell, prising at the floor.\""

[[dungeon.note]]
key = "scratched_tally"
hints = ["bruegal_cell"]
clue = "Bruegal sleeps in the last cell of the south wing, to the east."
display = 163
scale = 1.0
name = "Scratches on a Cell Wall"
at = [147.0, 42.0, -34.9]
facing = 4.7
text = "Hundreds of tally marks, and over them, scratched deep: \"BRUEGAL'S. LAST CELL OF THE SOUTH WING, EAST. DON'T WAKE HIM.\""

[[dungeon.note]]
key = "dry_bricks"
hints = ["bricked_cell"]
clue = "A cell bricked up without mortar, to be opened again quietly."
display = 164
scale = 1.3
name = "A Mason's Complaint"
at = [131.0, 52.0, -34.9]
facing = 1.57
text = "\"Bricked up cell 4 on the warden's orders, no mortar, he said: he wants it opened again quiet. What's he keeping in there?\""

