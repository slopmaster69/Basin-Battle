# The Scarlet Monastery's Graveyard: the Crusade's dead, who won't stay buried, and the
# torturers who keep the living company. A dungeon of its own beside the Deadmines (read like
# deadmines.toml: its lists join the rest; [dungeon] is its world).
#
# Places are WoW coordinates on map 189 (MonasteryInstances: x north, y west, z up), only the
# Graveyard wing's part of it read. In by the chapel door; down to the lower yard (Interrogator
# Vishas at his work); up into the graveyard itself (Ironspine walks it); the mausoleum steps (the
# second lamp); and down into the crypt, where Bloodmage Thalnos keeps the dead awake. Out by the
# chapel door. It's Hallow's End: one grave in the yard has a pumpkin on it.

[dungeon]
key = "graveyard"
name = "Scarlet Monastery: Graveyard"
map = 189
map_dir = "MonasteryInstances"
area = 796
window = [[1590.0, 950.0], [1900.0, 1470.0]]
icon = "Spell_Shadow_RaiseDead"
blurb = "The Crusade's dead, who won't stay buried, and their torturers"
first_page = "The Graveyard's chapel door. The bells have stopped; the digging hasn't."
welcome = "The Scarlet Monastery's Graveyard. The Crusade buries its dead here, and they don't stay buried; the Interrogator keeps the living busy. Two lamps: the chapel door, and the mausoleum steps. Rest at a lamp to heal, fill your Draughts (T) and send the dead back to their graves for a while. Fall, and what you found waits in a sack where you fell. Any lit lamp takes you home."
gate_raids = 0
# How hard next to the others (1 to 3): the Scarlet Monastery's Graveyard: among the hardest (26 to 36).
tier = 3
# The camp's first clear of it (every boss down in one run): into the chest. Scaled by tier
# (silver and bronze for a first dungeon, then pearl, then silk); tune freely.
first_clear = { silver = 4, pearl = 2, silk = 4 }
draught = "draught"
draughts = 3
draughts_max = 6
flask = "draught_flask"
plunder = "grave_dust"
hero_health = 0.7
exit = [1687.1, 1027.6, 18.7]
exit_radius = 5.0
exit_boss = "thalnos"
weapon_chance = 0.08
armor_chance = 0.06
boss_extra_chance = 0.25
reset_minutes = 30.0

[dungeon.trade]
whetstone = 6
tonic = 4

