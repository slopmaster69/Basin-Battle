[package]
name = "launcher"
version = "0.2.0"
edition = "2021"
description = "Play and Host: the two buttons in the Windows download (Play is the Mac app too)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "Play"
path = "src/bin/play.rs"

[[bin]]
name = "Host"
path = "src/bin/host.rs"

[features]
# Play with a console behind it, to see what it says while working on it.
console = []

[dependencies]
# The splash: one window, a picture, two fonts, a progress line. glow draws it on any PC.
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# GitHub and the download, over the system's own TLS (no C compiler needed to build this).
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# The one dialog: picking the WoW folder.
rfd = { version = "0.17", default-features = false }
dirs = "7"

# Linux only for trying the launcher out on a Linux PC (the dialog needs GTK there).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_Threading"] }

# Not a member of the repository's workspace: built on its own,
#   cargo build --release --manifest-path dist/windows/buttons/Cargo.toml
[workspace]

# (Not stripped: a stripped exe from the GNU toolchain can fail to start on Windows.)
[profile.release]
opt-level = 2
