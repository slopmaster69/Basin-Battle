# Play.exe and Host.exe: the two buttons at the top of the Windows download, each carrying the
# project's icon (the release workflow puts it on them with rcedit).
# - Play.exe is the launcher: its own window, the War Table menu (launcher\ui, drawn by the
#   WebView2 that Windows 10 and 11 come with). Without WebView2, or with Play.exe -Classic, it
#   starts launcher\play.ps1 instead, the plain window it had before.
# - Host.exe runs launcher\host.ps1 in its own console. No dependencies.
# Built on its own, outside the repository's workspace:
#   cargo build --release --manifest-path dist/windows/buttons/Cargo.toml
[package]
name = "buttons"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "Play"
path = "src/bin/play/main.rs"

[[bin]]
name = "Host"
path = "src/bin/host.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
rfd = { version = "0.17", default-features = false }
serde_json = "1"
dirs = "7"

# Linux only for trying the launcher out on a Linux PC (the dialogs need GTK there).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

# Not a member of the repository's workspace.
[workspace]

[profile.release]
opt-level = "s"
strip = true
