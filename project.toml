# What players see this project called, and where it lives. Change a name here and the scripts,
# the server's realm list, Play, Host and the next release's Windows download all use it: the
# download and its folder, the window titles and the realm each game runs on.
#
# Keep every line `key = "value"` on one line: the Windows and Mac scripts read this file with a
# plain search, not a TOML library, and Play and Host have it built in at compile time
# (dist/windows/buttons/src/folder.rs). Code names (the htl-* crates, addon/ElwynnSurvival,
# BasinBattle) don't change with these, and neither does what the games say in play.

# The whole project: the download is "<title> for Windows.zip", its folder, Play's window and
# the host window's title.
title = "Elwynn Survival"

# Each game's name: its realm in the realm list, and its line under Play's cog.
survival = "Elwynn Survival"
basin = "Basin Battle"

# Where releases (and the download's updates) come from: owner/name on GitHub.
repository = "slopmaster69/Basin-Battle"

# The group's server: the one address Play joins by itself, with :port when its login port isn't
# 3724. Anyone else's server is typed under Play's cog ("Someone else's"). Each server is its own
# world: heroes made on one aren't on the others.
server = "24.64.116.126"
server_name = "Corios's desktop"

# The password everyone logs in with. Host passes it to the server; Play hands it to the game.
password = "hold"
