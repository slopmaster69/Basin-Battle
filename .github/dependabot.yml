# Pull requests that keep the dependencies current, grouped so they arrive as one or two a month
# rather than one per crate. They go through CI like any other pull request; merge one when its
# checks pass. The pinned benilla client revision (scripts/common.sh) is updated by hand, not here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Dependencies:"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    # A major version changes the crate's API (rand 0.10 dropped the small_rng feature htl-sim
    # uses), so it needs code changes: done by hand on a branch, not proposed here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI:"
    groups:
      actions:
        patterns: ["*"]
