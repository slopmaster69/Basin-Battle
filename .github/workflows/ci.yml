# A pull request is checked for two things only: it builds on every system a player hosts on
# (Linux, Windows, macOS), and it merges into main without a conflict. With this many pull
# requests open side by side, that keeps each one quick to check, and a branch only needs
# bringing up to main when it actually conflicts.
#
# The tests, the add-on check and the end-to-end run go on main after every merge (and by hand,
# "Run workflow" on any branch), so a merge that breaks something shows on main at once. Tests
# that need the WoW 1.12.1 data are #[ignore]d and don't run here.
#
# Required for merging (the `main` ruleset): "Builds on Linux", "Server builds on Windows" and
# "Merges cleanly with main". The end-to-end job plays against a live server in real time; on a
# shared runner a timing test can miss its window, so it retries a failure twice: a test it lists
# as flaky or failing wants a look (and an issue) all the same.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; on main every merge gets its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: everything compiles (the server, the tools, the tests), nothing runs.
  linux-build:
    name: Builds on Linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build everything, tests included
        run: cargo build --release --workspace --all-targets

  macos-build:
    name: Server builds on macOS
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server, as "Host Basin Battle.command" does
        run: cargo build --release -p htl-server
      - name: The server starts
        run: target/release/htl-server --help

  # Pull requests: the branch and main merge without a conflict. If not, bring it up to main
  # (`git pull --rebase origin main`), fix the conflicts and push.
  merges:
    name: Merges cleanly with main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Merge main into the branch (not pushed)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          if ! git -c user.name=ci -c user.email=ci@localhost merge --no-commit --no-ff "origin/$BASE" >/dev/null; then
            echo "::error::This branch conflicts with $BASE. Bring it up to $BASE (git pull --rebase origin $BASE), fix these files and push:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "Merges into $BASE without a conflict."

  # main (after each merge) and by hand: the tests and the add-ons.
  test:
    name: Tests and add-ons (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/addon-harness
            tools/clip-census
      - name: Build the server
        run: cargo build --release -p htl-server
      - name: Unit tests
        run: cargo test --release --workspace --lib --bins
      - name: The clip census's motion measure
        run: cargo test --release --manifest-path tools/clip-census/Cargo.toml
      - name: Add-ons load and run without Lua errors
        run: |
          scripts/check-addon.sh | tee addon-check.txt
          if grep -E "^[0-9]+x |LOAD ERROR|BINDINGS ERROR" addon-check.txt; then
            echo "The add-ons raised Lua errors (above)." >&2
            exit 1
          fi

  end-to-end:
    name: End-to-end, real time (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: The live-server tests, one at a time, a failure retried twice
        run: cargo nextest run --release -p htl-server --tests --test-threads 1 --retries 2

  windows-server:
    name: Server builds on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The toolchain "Host Basin Battle.bat" installs on a player's PC: GNU, not MSVC, so no
      # Visual Studio is needed (and crates/htl-server/src/mingw_tz.rs is linked in).
      - name: Rust with the GNU toolchain, as the host script installs it
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      # A player's PC has no MinGW, but the runner has several (mingw64, Strawberry Perl, MSYS2);
      # take their gcc and dlltool off the PATH so the build can only work the way it will at
      # home (without dlltool, windows-sys's raw-dylib links fail unless windows-rust.ps1 copes).
      - name: No MinGW on the PATH, as on a player's PC
        run: |
          $keep = $env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) -and -not (Test-Path (Join-Path $_ 'dlltool.exe'))
          }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: Swatinem/rust-cache@v2
      - name: Build the server, set up as "Host Basin Battle.bat" does
        run: |
          foreach ($tool in 'gcc', 'dlltool') {
            if (Get-Command $tool -ErrorAction SilentlyContinue) { throw "$tool is still on the PATH" }
          }
          . scripts\windows-rust.ps1
          cargo build --release -p htl-server
      # It starts at all: every DLL it imports is found, _get_timezone included.
      - name: The server starts
        run: |
          target\release\htl-server.exe --help
          if ($LASTEXITCODE -ne 0) { throw "htl-server.exe --help failed (exit $LASTEXITCODE)" }
