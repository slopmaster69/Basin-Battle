# Push a tag (git tag v0.4.0 && git push origin v0.4.0) to build "Basin Battle for Windows.zip":
# the pinned benilla client with this repo's patches, built for Windows, plus the launcher and the
# add-ons, attached to a GitHub release for that tag. It holds no WoW files.
#
# To try a branch's Windows client before a release: Actions -> Release -> Run workflow on that
# branch (or `gh workflow run release.yml --ref <branch>`). The zip's folder is then the run's
# "Basin Battle for Windows" artifact, and no release is made.
#
# The visual check's client (docs/visual-check.md): Run workflow with "dev" ticked (or
# `gh workflow run release.yml --ref <branch> -f dev=true`) builds benilla's dev build instead,
# whose scripted probes (log in, type chat, take screenshots, quit) drive the check. It's kept as
# the run's "Basin Battle for Windows (visual check)" artifact and never attached to a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dev:
        description: "Build the dev client for the visual check (scripted probes) instead of the player build; never released"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # A tag push has no inputs: the player build.
      PACKAGE: ${{ inputs.dev && 'Basin Battle for Windows (visual check)' || 'Basin Battle for Windows' }}
    steps:
      - uses: actions/checkout@v7

      # The script that drives the dev client, under the Windows PowerShell players have: every
      # scenario read and turned into the client's Lua, nothing run.
      - name: Read the visual check's scenarios
        if: ${{ inputs.dev }}
        shell: powershell
        run: scripts\visual-check-windows.ps1 -Check

      - name: Fetch the pinned benilla and apply the patches
        shell: bash
        run: |
          rev=$(sed -n 's/^BENILLA_REV="\(.*\)"/\1/p' scripts/common.sh)
          repo=$(sed -n 's/^BENILLA_REPO="\(.*\)"/\1/p' scripts/common.sh)
          git clone -q "$repo" benilla
          git -C benilla checkout -q "$rev"
          for p in patches/benilla/*.patch; do
            git -C benilla apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benilla
          # The dev build compiles other features: it keeps a cache of its own (the player
          # build's key stays as it was).
          key: ${{ inputs.dev && 'dev' || '' }}

      - name: "Build the client (the player build, its settings and add-ons beside the exe)"
        if: ${{ !inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla --no-default-features

      # The visual check sets BENILLA_HOME, since a dev build otherwise keeps its settings and
      # add-ons in this runner's source folder.
      - name: "Build the dev client (default features: the scripted probes the visual check drives)"
        if: ${{ inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla

      - name: Package
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: |
          $out = "dist-out/Basin Battle for Windows"
          New-Item -ItemType Directory -Force -Path "$out/benilla-config/AddOns" | Out-Null
          Copy-Item benilla/target/release/benilla.exe "$out/"
          Copy-Item "dist/windows/Play Basin Battle.bat", "dist/windows/Play Elwynn Survival.bat", `
            dist/windows/launcher.ps1, dist/windows/README.txt, dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE "$out/"
          # As config.default.toml: the launcher copies it to config.toml on a first run only.
          Copy-Item dist/windows/benilla-config/config.toml "$out/benilla-config/config.default.toml"
          Copy-Item -Recurse addon/BasinBattle, addon/ElwynnSurvival "$out/benilla-config/AddOns/"
          Compress-Archive -Path $out -DestinationPath "dist-out/Basin Battle for Windows.zip"

      # The exe alone: the visual check brings the branch's own add-ons and a settings folder of
      # its own each run, and the player launchers would start this build without them.
      - name: Package the dev client
        if: ${{ inputs.dev }}
        shell: pwsh
        run: |
          $out = "dist-out/$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item benilla/target/release/benilla.exe "$out/"
          Copy-Item dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE "$out/"
          Set-Content "$out/README.txt" @(
            "The dev build of the Basin Battle client, for the visual check only. Don't play with it.",
            "Built from $env:GITHUB_REF_NAME ($env:GITHUB_SHA).",
            "Run it with Visual Check.bat from the repository, which docs/visual-check.md explains."
          )

      # Every run keeps the folder as an artifact (a week), so a branch can be tried before a tag.
      - name: Keep the folder as the run's artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist-out/${{ env.PACKAGE }}
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dev
        uses: softprops/action-gh-release@v3
        with:
          files: dist-out/Basin Battle for Windows.zip
          generate_release_notes: true
