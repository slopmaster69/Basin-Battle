# The Windows download, "<title> for Windows.zip" (the title is project.toml's): the pinned
# benilla client with this repo's patches, the server, both built for Windows, the add-ons, the
# server's content, and Play.exe and Host.exe (dist/windows/buttons), all three exes wearing
# dist/windows/art/icon.ico. It holds no WoW files.
#
# - A tag (git tag v0.5.0 && git push origin v0.5.0) attaches it to a GitHub release for that tag.
#   A folder unzipped from it updates itself from later releases (Play, by version.txt).
# - Every push to main publishes it as the `latest` pre-release, replaced each time, so the newest
#   main is playable minutes after a merge: Play's cog > "Make a test copy" plays it in a folder
#   of its own. Players' Play never updates to it (it only looks at releases).
# - Actions -> Release -> Run workflow on a branch (or `gh workflow run release.yml --ref <branch>`)
#   builds a branch's folder as the run's artifact; its version says so, and it never updates.
#
# The visual check's client (docs/visual-check.md): Run workflow with "dev" ticked (or
# `gh workflow run release.yml --ref <branch> -f dev=true`) builds benilla's dev build instead,
# whose scripted probes (log in, type chat, take screenshots, quit) drive the check. It's kept as
# the run's "<title> for Windows (visual check)" artifact and never attached to a release.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dev:
        description: "Build the dev client for the visual check (scripted probes) instead of the player build; never released"
        type: boolean
        default: false

permissions:
  contents: write

# Two merges in quick succession: only the newer main is built as `latest`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # A tag or main push has no inputs: the player build.
      PACKAGE: ${{ inputs.dev && 'Elwynn Survival for Windows (visual check)' || 'Elwynn Survival for Windows' }}
    steps:
      - uses: actions/checkout@v7

      # The script that drives the dev client, under the Windows PowerShell players have: every
      # scenario read and turned into the client's Lua, nothing run.
      - name: Read the visual check's scenarios
        if: ${{ inputs.dev }}
        shell: powershell
        run: scripts\visual-check-windows.ps1 -Check

      - name: Fetch the pinned benilla and apply the patches
        shell: bash
        run: |
          rev=$(sed -n 's/^BENILLA_REV="\(.*\)"/\1/p' scripts/common.sh)
          repo=$(sed -n 's/^BENILLA_REPO="\(.*\)"/\1/p' scripts/common.sh)
          git clone -q "$repo" benilla
          git -C benilla checkout -q "$rev"
          for p in patches/benilla/*.patch; do
            git -C benilla apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benilla
          # The dev build compiles other features: it keeps a cache of its own (the player
          # build's key stays as it was).
          key: ${{ inputs.dev && 'dev' || '' }}

      - name: "Build the client (the player build, its settings and add-ons beside the exe)"
        if: ${{ !inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla --no-default-features

      # The visual check sets BENILLA_HOME, since a dev build otherwise keeps its settings and
      # add-ons in this runner's source folder.
      - name: "Build the dev client (default features: the scripted probes the visual check drives)"
        if: ${{ inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla

      # The server ships ready to run, so hosting needs no Rust and no build. Built the way
      # "Host Basin Battle.bat" builds it on a player's PC (the GNU toolchain, no MinGW on the
      # PATH: see ci.yml's windows-server job), so it runs on a PC with nothing installed.
      - name: Rust with the GNU toolchain for the server
        if: ${{ !inputs.dev }}
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.dev }}
        with:
          key: server

      - name: Build the server
        if: ${{ !inputs.dev }}
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) -and -not (Test-Path (Join-Path $_ 'dlltool.exe'))
          }) -join ';'
          . scripts\windows-rust.ps1
          cargo build --release -p htl-server
          if ($LASTEXITCODE -ne 0) { throw "the server didn't build" }
          target\release\htl-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "htl-server.exe --help failed (exit $LASTEXITCODE)" }

      # Play and Host, the two buttons, with their own tests; then the project's shield on them
      # and on the game (rcedit writes the icon into an exe that's already built).
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.dev }}
        with:
          workspaces: dist/windows/buttons
          key: buttons

      - name: Build the buttons, and put the icon on them and on the game
        if: ${{ !inputs.dev }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo test --release --manifest-path dist/windows/buttons/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the buttons' tests failed" }
          cargo build --release --manifest-path dist/windows/buttons/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the buttons didn't build" }
          Invoke-WebRequest -UseBasicParsing -OutFile rcedit.exe -Uri https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          foreach ($exe in "dist/windows/buttons/target/release/Play.exe", "dist/windows/buttons/target/release/Host.exe", "benilla/target/release/benilla.exe") {
            ./rcedit.exe $exe --set-icon dist/windows/art/icon.ico
            if ($LASTEXITCODE -ne 0) { throw "rcedit couldn't put the icon on $exe" }
          }

      - name: Package
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: |
          # The title players see, from project.toml.
          $title = "Elwynn Survival"
          foreach ($line in Get-Content project.toml) { if ($line -match '^\s*title\s*=\s*"([^"]+)"') { $title = $Matches[1] } }
          $package = "$title for Windows"
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $out = "dist-out/$package"
          New-Item -ItemType Directory -Force -Path "$out/benilla-config/AddOns", "$out/server", "$out/licenses" | Out-Null
          # The folder: the two buttons, the game, the read-me, and nothing a player never opens.
          Copy-Item dist/windows/buttons/target/release/Play.exe, dist/windows/buttons/target/release/Host.exe, dist/windows/README.txt "$out/"
          Copy-Item benilla/target/release/benilla.exe "$out/"
          # As config.default.toml: Play copies it to config.toml on a first run only.
          Copy-Item dist/windows/benilla-config/config.toml "$out/benilla-config/config.default.toml"
          Copy-Item -Recurse addon/BasinBattle, addon/ElwynnSurvival "$out/benilla-config/AddOns/"
          # The server and its content (saves and logs are made beside them on the host's PC).
          Copy-Item target/release/htl-server.exe "$out/server/"
          Copy-Item -Recurse content "$out/server/content"
          Copy-Item dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE, dist/windows/buttons/fonts/OFL.txt "$out/licenses/"
          # The version Play updates from: a release's tag; "latest <commit>" for main, which the
          # `latest` pre-release replaces at every merge; a branch's build, which never updates.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_REF -eq "refs/heads/main") { "latest $sha" } else { "branch $env:GITHUB_REF_NAME ($sha)" }
          Set-Content -Path "$out/version.txt" -Value $version
          # The buttons answer for themselves.
          & "$out/Host.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Host.exe --version failed (exit $LASTEXITCODE)" }

      # Play draws its splash on this runner and keeps a picture of it, so the first thing a
      # player sees can be seen here without running anything. The runner may have no OpenGL:
      # then there is no picture, and the folder is still good.
      - name: Play draws its splash
        if: ${{ !inputs.dev }}
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "dist-out/$env:PACKAGE"
          $p = Start-Process -FilePath "$out/Play.exe" -ArgumentList "--shot", "$PWD/dist-out/play-splash.png" -WorkingDirectory $out -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Play didn't finish its picture in a minute" }
          if (Test-Path "$out/play.log") { Get-Content "$out/play.log" }
          if (Test-Path "$out/play-crash.txt") { Get-Content "$out/play-crash.txt" }
          Remove-Item "$out/play.log", "$out/play-crash.txt", "$out/settings.txt" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "dist-out/play-splash.png")) { throw "no picture of the splash (no OpenGL on this runner?)" }

      - name: The picture of Play's splash
        if: ${{ !inputs.dev }}
        uses: actions/upload-artifact@v7
        with:
          name: play-splash
          path: dist-out/play-splash.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Zip
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: Compress-Archive -Path "dist-out/$env:PACKAGE" -DestinationPath "dist-out/$env:PACKAGE.zip"

      # The exe alone: the visual check brings the branch's own add-ons and a settings folder of
      # its own each run, and Play would start this build without them.
      - name: Package the dev client
        if: ${{ inputs.dev }}
        shell: pwsh
        run: |
          $out = "dist-out/$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item benilla/target/release/benilla.exe "$out/"
          Copy-Item dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE "$out/"
          Set-Content "$out/README.txt" @(
            "The dev build of the client, for the visual check only. Don't play with it.",
            "Built from $env:GITHUB_REF_NAME ($env:GITHUB_SHA).",
            "Run it with Visual Check.bat from the repository, which docs/visual-check.md explains."
          )

      # Every run keeps the folder as an artifact (a week), so a branch can be tried before a tag.
      - name: Keep the folder as the run's artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist-out/${{ env.PACKAGE }}
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dev
        uses: softprops/action-gh-release@v3
        with:
          files: dist-out/${{ env.PACKAGE }}.zip
          generate_release_notes: true

      # The newest main, as the `latest` pre-release: the one before it is removed, tag and all,
      # so there is always exactly one, pointing at the commit it was built from.
      - name: Publish as the latest pre-release
        if: github.ref == 'refs/heads/main' && !inputs.dev
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { "No earlier latest to remove." }
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          gh release create latest "dist-out/$env:PACKAGE.zip" --prerelease --target $env:GITHUB_SHA --title "Latest main ($sha)" --notes "The newest main ($env:GITHUB_SHA), rebuilt at every merge, for playtests. Not a release: players' Play never updates to it. In Play, the cog > Make a test copy plays it in a folder of its own."
          if ($LASTEXITCODE -ne 0) { throw "couldn't publish the latest pre-release" }
