# Push a tag (git tag v0.4.0 && git push origin v0.4.0) to build "<title> for Windows.zip" (the
# title is project.toml's): the pinned benilla client with this repo's patches, the server, both
# built for Windows, the add-ons, the server's content, and Play.exe and Host.exe with their
# launcher (all three exes wearing dist/windows/art/icon.ico; Play's menu is launcher\ui), attached to a GitHub release for that tag. It holds no WoW files. A folder unzipped
# from it updates itself from later releases (launcher\update.ps1, by the tag in
# launcher\version.txt).
#
# To try a branch's Windows build before a release: Actions -> Release -> Run workflow on that
# branch (or `gh workflow run release.yml --ref <branch>`). The zip's folder is then the run's
# artifact, and no release is made; its version says it's a branch build, so it never updates
# itself over to a release.
#
# The visual check's client (docs/visual-check.md): Run workflow with "dev" ticked (or
# `gh workflow run release.yml --ref <branch> -f dev=true`) builds benilla's dev build instead,
# whose scripted probes (log in, type chat, take screenshots, quit) drive the check. It's kept as
# the run's "Basin Battle for Windows (visual check)" artifact and never attached to a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dev:
        description: "Build the dev client for the visual check (scripted probes) instead of the player build; never released"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # A tag push has no inputs: the player build.
      PACKAGE: ${{ inputs.dev && 'Basin Battle for Windows (visual check)' || 'Basin Battle for Windows' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history for the launcher's dispatches (scripts/launcher-news.py).
          fetch-depth: 100

      # The script that drives the dev client, under the Windows PowerShell players have: every
      # scenario read and turned into the client's Lua, nothing run.
      - name: Read the visual check's scenarios
        if: ${{ inputs.dev }}
        shell: powershell
        run: scripts\visual-check-windows.ps1 -Check

      - name: Fetch the pinned benilla and apply the patches
        shell: bash
        run: |
          rev=$(sed -n 's/^BENILLA_REV="\(.*\)"/\1/p' scripts/common.sh)
          repo=$(sed -n 's/^BENILLA_REPO="\(.*\)"/\1/p' scripts/common.sh)
          git clone -q "$repo" benilla
          git -C benilla checkout -q "$rev"
          for p in patches/benilla/*.patch; do
            git -C benilla apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benilla
          # The dev build compiles other features: it keeps a cache of its own (the player
          # build's key stays as it was).
          key: ${{ inputs.dev && 'dev' || '' }}

      - name: "Build the client (the player build, its settings and add-ons beside the exe)"
        if: ${{ !inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla --no-default-features

      # The visual check sets BENILLA_HOME, since a dev build otherwise keeps its settings and
      # add-ons in this runner's source folder.
      - name: "Build the dev client (default features: the scripted probes the visual check drives)"
        if: ${{ inputs.dev }}
        working-directory: benilla
        run: cargo build --release -p benilla --bin benilla

      # The server ships ready to run, so hosting needs no Rust and no build. Built the way
      # "Host Basin Battle.bat" builds it on a player's PC (the GNU toolchain, no MinGW on the
      # PATH: see ci.yml's windows-server job), so it runs on a PC with nothing installed.
      - name: Rust with the GNU toolchain for the server
        if: ${{ !inputs.dev }}
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.dev }}
        with:
          key: server

      - name: Build the server
        if: ${{ !inputs.dev }}
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) -and -not (Test-Path (Join-Path $_ 'dlltool.exe'))
          }) -join ';'
          . scripts\windows-rust.ps1
          cargo build --release -p htl-server
          if ($LASTEXITCODE -ne 0) { throw "the server didn't build" }
          target\release\htl-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "htl-server.exe --help failed (exit $LASTEXITCODE)" }

      # Play.exe and Host.exe, the two buttons; then the project's shield on them and on the game
      # (rcedit writes the icon into an exe that's already built: no change to the client).
      - name: Build the buttons, and put the icon on them and on the game
        if: ${{ !inputs.dev }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --manifest-path dist/windows/buttons/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the buttons didn't build" }
          Invoke-WebRequest -UseBasicParsing -OutFile rcedit.exe -Uri https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          foreach ($exe in "dist/windows/buttons/target/release/Play.exe", "dist/windows/buttons/target/release/Host.exe", "benilla/target/release/benilla.exe") {
            ./rcedit.exe $exe --set-icon dist/windows/art/icon.ico
            if ($LASTEXITCODE -ne 0) { throw "rcedit couldn't put the icon on $exe" }
          }

      - name: Package
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: |
          # The title players see, from project.toml.
          $title = "Basin Battle"
          foreach ($line in Get-Content project.toml) { if ($line -match '^\s*title\s*=\s*"([^"]+)"') { $title = $Matches[1] } }
          $package = "$title for Windows"
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $out = "dist-out/$package"
          New-Item -ItemType Directory -Force -Path "$out/benilla-config/AddOns", "$out/launcher", "$out/server" | Out-Null
          # The top of the folder: the two buttons, the read-me and the game.
          Copy-Item dist/windows/buttons/target/release/Play.exe, dist/windows/buttons/target/release/Host.exe, dist/windows/README.txt "$out/"
          Copy-Item benilla/target/release/benilla.exe "$out/"
          # As config.default.toml: Play copies it to config.toml on a first run only.
          Copy-Item dist/windows/benilla-config/config.toml "$out/benilla-config/config.default.toml"
          Copy-Item -Recurse addon/BasinBattle, addon/ElwynnSurvival "$out/benilla-config/AddOns/"
          # What the buttons run, the names, the licences and the version it updates from.
          Copy-Item dist/windows/launcher/*.ps1, project.toml, dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE "$out/launcher/"
          # The shield: the launcher's window shows it, and its title bar's icon.
          Copy-Item dist/windows/art/icon.ico, dist/windows/art/shield.png "$out/launcher/"
          # Play's menu (the War Table), with the shield, and the latest changes as its dispatches.
          Copy-Item -Recurse dist/windows/launcher/ui "$out/launcher/ui"
          Copy-Item dist/windows/art/shield.png "$out/launcher/ui/"
          python scripts/launcher-news.py "$out/launcher/ui/news.json"
          if ($LASTEXITCODE -ne 0) { throw "the launcher's news didn't build" }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "branch $env:GITHUB_REF_NAME ($($env:GITHUB_SHA.Substring(0, 7)))" }
          Set-Content -Path "$out/launcher/version.txt" -Value $version
          # The server and its content (saves and logs are made beside them on the host's PC).
          Copy-Item target/release/htl-server.exe "$out/server/"
          Copy-Item -Recurse content "$out/server/content"

      # Play opens on this runner as on a player's PC: its window, the menu in WebView2, the map
      # drawn. A picture of the screen is kept as an artifact. What it wrote while it ran (its log,
      # settings.txt) is removed before the zip is made. A dev build has no Play to open.
      - name: Play opens its menu
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: |
          $out = "dist-out/$env:PACKAGE"
          $log = "$out/launcher/play.log"
          Start-Process -FilePath "$out/Play.exe" -ArgumentList "-NoUpdate" -WorkingDirectory $out
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern "the menu is drawn" -Quiet))) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $shot.Save("$PWD/dist-out/play-menu.png")
          Get-Process Play -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (Test-Path $log) { Get-Content $log }
          $drawn = (Test-Path $log) -and (Select-String -Path $log -Pattern "the menu is drawn" -Quiet)
          Remove-Item $log, "$out/settings.txt" -Force -ErrorAction SilentlyContinue
          if (-not $drawn) { throw "Play's menu didn't open (see the picture in the play-menu artifact)" }

      - name: The picture of Play's menu
        if: ${{ always() && !inputs.dev }}
        uses: actions/upload-artifact@v7
        with:
          name: play-menu
          path: dist-out/play-menu.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Zip
        if: ${{ !inputs.dev }}
        shell: pwsh
        run: Compress-Archive -Path "dist-out/$env:PACKAGE" -DestinationPath "dist-out/$env:PACKAGE.zip"

      # The exe alone: the visual check brings the branch's own add-ons and a settings folder of
      # its own each run, and the player launchers would start this build without them.
      - name: Package the dev client
        if: ${{ inputs.dev }}
        shell: pwsh
        run: |
          $out = "dist-out/$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item benilla/target/release/benilla.exe "$out/"
          Copy-Item dist/windows/LICENSE-MIT, dist/windows/LICENSE-APACHE "$out/"
          Set-Content "$out/README.txt" @(
            "The dev build of the Basin Battle client, for the visual check only. Don't play with it.",
            "Built from $env:GITHUB_REF_NAME ($env:GITHUB_SHA).",
            "Run it with Visual Check.bat from the repository, which docs/visual-check.md explains."
          )

      # Every run keeps the folder as an artifact (a week), so a branch can be tried before a tag.
      - name: Keep the folder as the run's artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist-out/${{ env.PACKAGE }}
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dev
        uses: softprops/action-gh-release@v3
        with:
          files: dist-out/${{ env.PACKAGE }}.zip
          generate_release_notes: true
