# Play on a Mac: Play Basin Battle.command's build (scripts/mac-launcher.sh makes the app), the
# launcher's own tests, and Play drawing its splash on the runner's screen, kept as a picture (the
# play-splash-mac artifact). Runs when the launcher or the Mac scripts change, and by hand.
name: Launcher on a Mac

on:
  pull_request:
    paths:
      - "dist/windows/buttons/**"
      - "dist/windows/art/**"
      - "scripts/mac-launcher.sh"
      - "Play Basin Battle.command"
      - ".github/workflows/launcher-mac.yml"
  workflow_dispatch:

jobs:
  mac-app:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dist/windows/buttons
      - name: Build Play and the app
        run: bash scripts/mac-launcher.sh
      - name: The launcher's own tests
        run: cargo test --release --manifest-path dist/windows/buttons/Cargo.toml
      - name: Play draws its splash
        run: |
          ./dist/windows/buttons/target/release/Play --shot "$PWD/play-splash-mac.png" &
          pid=$!
          for i in $(seq 1 60); do
            [ -f play-splash-mac.png ] && break
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          sleep 1
          kill $pid 2>/dev/null || true
          cat logs/launcher.log 2>/dev/null || true
          [ -f play-splash-mac.png ] || { echo "Play drew no splash (logs/launcher.log above)"; exit 1; }
      - name: The picture of Play's splash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-splash-mac
          path: play-splash-mac.png
          if-no-files-found: ignore
          retention-days: 7
